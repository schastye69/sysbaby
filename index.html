/* --- backdrop ---------------------------------------------------------- */
/* Фон был видеороликом с CDN GoDaddy — единственная внешняя зависимость
   страницы, которая продаёт независимость от внешних сервисов. Если бы файл
   умер, фон исчез бы молча. Видео, тинт над ним и сканирующая полоса удалены
   вместе с их кодом: страница стоит на собственном поле --bg, и ни один её
   пиксель больше не живёт на чужом сервере.

   Остались два слоя: .wallpaper (три радиальных свечения — в тёмной теме они
   прозрачны и ничего не стоят, в светлой несут её тепло) и .grain поверх
   текста страницы, под окнами и хромом. */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.backdrop .wallpaper{
  position:absolute;inset:-6%;
  background:
    radial-gradient(circle at 20% 25%,var(--radial1),transparent 45%),
    radial-gradient(920px 660px at 82% 12%,var(--radial2),transparent 62%),
    radial-gradient(340px 260px at 82% 12%,var(--radial-core),transparent 70%),
    radial-gradient(circle at 50% 80%,var(--radial3),transparent 55%),
    linear-gradient(180deg,transparent 0%,transparent 66%,var(--floor) 100%);
  transition:background .6s ease;
  /* Дыхание комнаты: один transform-слой, 80 секунд туда-обратно.
     Не анимация ради анимации — свет в настоящей комнате тоже не мёртв.
     Композитный transform не стоит ни кадра; при reduced-motion и на
     паузе — неподвижен, и это полноценное состояние, а не деградация. */
  animation:wallpaperBreath 80s ease-in-out infinite alternate;
}
@keyframes wallpaperBreath{
  from{transform:translate3d(-.6%,-.4%,0) scale(1)}
  to{transform:translate3d(.6%,.5%,0) scale(1.045)}
}
@media (prefers-reduced-motion:reduce){.backdrop .wallpaper{animation:none}}
html[data-anim="paused"] .backdrop .wallpaper{animation:none}

/* film grain. Sits above the hero (z 10) and below windows (200), dock (300)
   and the top bar (400) — the same place it holds in the original, where it
   is z 5 against windows at 20 and a top bar at 800. */
.grain{
  position:fixed;inset:0;z-index:11;pointer-events:none;
  filter:url(#grainFilter);
  opacity:.35;
  mix-blend-mode:overlay;
  transition:opacity .4s ease;
}

/* Знак. Появляется один раз при загрузке и больше не двигается никогда.

   Логотип, который пульсирует вечно, — это ровно тот дефект, который сегодня
   был убран из этой же шапки: анимация ради присутствия стоит кадра каждый
   кадр. Здесь движение однократное, на transform и opacity, то есть на
   композиторе, и после 0,7 секунды слой замирает навсегда. */
/* Знак стоит в шапке ОДИН раз — точкой внутри имени. Иконка рядом со словом,
   уже содержащим её, — это одно и то же сказанное дважды. Одна фигура живёт
   на трёх масштабах: значок вкладки — бренд, точка внутри слова — имя,
   крупная фигура (занавес ОС) — печать.

   Прежние величины (доля 0,50 от кегля, подъём 0,06em, вся строка mono)
   отменены решением 018 — их диагноз в комментарии ниже. Настоящая точка
   по-прежнему невидима в разметке: слово копируется как «sys.baby». */
/* СЛОВЕСНЫЙ ЗНАК 2.0 — «ДВЕ РЕЧИ» (13.08.2026, решение 018).
   Вердикт основателя: иконка шикарна, знак в шапке «совсем не нравится».

   Диагноз прежней версии: всё имя говорило голосом машины — mono, разрядка,
   знак 6px с приподнятой серединой. На телефоне это читалось как
   «sys ▫ baby»: три предмета вместо одного имени, и сильнейшая фигура
   бренда работала мусорным квадратиком.

   Решение: имя произносит тезис продукта собственным телом.
   sys  — голос машины: тот же var(--mono) и тот же трекинг .12em, каким
          на сайте говорят все машинные подписи (кикер, цены, метки дока);
   baby — голос человека: гарнитура заголовков, вес 700, плотный набор;
   знак — мост между ними, на месте точки домена, цветом акцента, у базовой
          линии. 10px — минимум, на котором геометрия сцепки читается,
          а не угадывается (6px прежней версии — не читалась).

   РАЗМЕР ОБЕИХ РЕЧЕЙ ОДИН. Первая редакция давала sys 13px против baby
   15.5px; основатель сказал, что разница «выглядит немножко не аккуратно»,
   и был прав. Прибор (tools/wm-xh.mjs) померил высоту строчных на канве:
   7px против 9px — baby выше на 29%. Две гарнитуры при этом имеют почти
   одинаковое отношение x-height к кеглю, поэтому равный кегль = равная
   оптическая высота: 15.5/15.5 → 9px против 9px.

   И это не только опрятнее, это вернее по смыслу. Разница в кегле означала
   бы, что baby важнее sys. Они равны: машина и человек — две половины
   одного имени, ровно как «WE BUILD IT. YOU OWN IT.» — две равные части
   одного предложения. Речи различаются гарнитурой, весом, цветом и
   трекингом — всем, КРОМЕ размера.

   Проверено съёмкой (tools/wm-lab.html) против V1 (вся строка display),
   V3 (литеры из модуля знака — умерла на 17px: стенсильный разрез,
   отличающий «a» от «o», меньше пикселя) и V5 (просто типографика);
   на втором круге — против ужатого трекинга .08em (рвёт правило,
   общее с кикером) и знака 11px без подъёма (садится тяжело).
   Отвергнутые варианты и причины — kb/decisions, запись 018. */
.sb-wm{display:inline-flex;align-items:baseline;white-space:nowrap}
.sb-sys{font-family:var(--mono);font-size:15.5px;font-weight:500;letter-spacing:.12em;color:#c9c4bc;line-height:1}

/* --- hero -------------------------------------------------------------- */
.hero{
  position:fixed;inset:0;z-index:10;display:flex;justify-content:center;
  /* `safe center` is the whole fix for the clipped first line. A centred flex
     item taller than its container overflows in BOTH directions, and the top
     overflow of a fixed box is unreachable — which is how "BUILDING" went
     missing on short viewports. `safe` falls back to start alignment the
     moment the content stops fitting, and overflow-y makes the rest
     reachable. Nothing shrinks; nothing is redesigned. */
  align-items:safe center;
  overflow-y:auto;overscroll-behavior:contain;
  padding:74px 4vw 190px;pointer-events:none;
}
.hero-inner{width:min(1200px,92%);pointer-events:auto}
/* The headline is set to its own longest word.

   Russian and Estonian carry words this design was not drawn around —
   АВТОМАТИЗИРОВАННЫЙ is eighteen characters, AUTOMATISEERITUD sixteen — and
   at the English size they run off the edge of a phone. Shrinking the whole
   headline until the worst case fits would punish every other language for
   one word, so instead the type is sized by the word itself: --hero-chars is
   the character count of the longest word in the current language, written
   by renderHero, and --hero-fit is the largest size at which that word still
   spans the line without touching either edge. The headline takes whichever
   is smaller, its designed size or that fit.

   0.58em is the measured average advance of this face at weight 900 in caps.
   The tracking tightens as the word grows — a long word reads as deliberately
   condensed rather than accidentally small — and stops at -.055em, past which
   the letters start to touch. */
/* Строка-имя над заголовком: голос машины, регистр меток дока. Инициалы
   на тон ярче — не тусклее: гасить непроявленные буквы ниже порога чтения
   нельзя, поднимать проявленные — можно. */
.hero-name-line{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.hero-name-line b{font-weight:inherit;color:var(--text);transition:color .55s ease}
/* Пульс инициала: буква на мгновение возвращается в неразрешённое состояние —
   глиф в цвете глины, — затем оседает обратно и остывает в белый. Тот же
   закон, что у занавеса ОС и посадки подсказки дока: неразрешённое — глина,
   разрешённое — текст. В глину — мгновенно (без transition), обратно —
   остыванием через transition цвета выше. */
.hero-name-line b.is-unresolved{color:var(--accent);transition:none}
@media (max-width:380px){.hero-name-line{font-size:9.5px;letter-spacing:.18em}}
/* Заголовок больше не кричит капслоком в 900-м весе. Три причины из линии
   v17, и все три пережили трибунал: (1) 900-го веса здесь физически нет —
   системные гарнитуры дают его синтетически, а синтетический жир ломает
   форму знака, особенно кириллицы; (2) капслок этого размера — язык
   рекламного щита, он проваливает тест «подставь другое имя»; (3) контраст
   голосов структурный: машина говорит моноширинными метками в капсе,
   человек — предложениями в обычном регистре. Заголовок — голос человека. */
.hero h1{
  --hero-chars:10;
  --hero-fit:76px;
  font-size:min(clamp(34px,4.6vw,68px), var(--hero-fit));
  font-weight:var(--w-strong,600);line-height:1.04;
  letter-spacing:clamp(-.035em,calc(-.018em - (var(--hero-chars) - 10) * .002em),-.012em);
  margin:0 0 22px;text-wrap:balance;max-width:44rem;
}
/* When even the fit would take the headline below reading size — eighteen
   Cyrillic capitals on a 320px phone cannot be large and whole at once — the
   word is allowed to break instead. A hyphenated АВТОМАТИЗИ- / РОВАННЫЙ at
   full size is a better headline than one unbroken line at twenty pixels, and
   it reads as a decision rather than as a shrink. */
.hero h1.is-tight{
  font-size:clamp(30px,8.5vw,54px);
  -webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;
}
/* Строка цен: моноширинная метаинформация, не кнопка и не баннер. Вся
   лестница из SB_PRICING, единственного источника. */
.hero-price{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted);margin:0 0 14px;font-variant-numeric:tabular-nums}
.hero p.hero-text{font-size:19px;line-height:1.55;color:var(--muted);max-width:720px;margin:0 0 30px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;padding:15px 26px;font-size:14px;font-weight:600;
  border:1px solid var(--border);text-decoration:none;cursor:pointer;
  background:var(--glass);color:var(--text);
  transition:transform .3s var(--ease),background .3s,border-color .3s,box-shadow .3s;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent-soft);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.hero .explore-note,.hero .hero-note{font-size:12.5px;color:var(--muted);max-width:640px;line-height:1.6;margin:0 0 12px}
.hero .hero-note{display:flex;align-items:flex-start;gap:7px;margin-top:14px}
.hero .hero-note svg{width:13px;height:13px;flex:none;margin-top:2px;color:var(--accent)}
.hero-proof{display:none;border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:18px 0 0;max-width:620px}
.hero-proof.is-shown{display:block}
.hero-proof .p-main{font-size:13.5px;line-height:1.55}
.hero-proof .p-src{font-size:11.5px;color:var(--muted);margin-top:4px}
/* staggered reveal after boot */
.reveal{opacity:0;transform:translateY(16px);filter:blur(6px)}
.is-revealed .reveal{opacity:1;transform:none;filter:none;transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s var(--ease)}
.is-revealed .reveal:nth-child(2){transition-delay:.09s}
.is-revealed .reveal:nth-child(3){transition-delay:.18s}
.is-revealed .reveal:nth-child(4){transition-delay:.27s}
.is-revealed .reveal:nth-child(5){transition-delay:.34s}
.is-revealed .reveal:nth-child(6){transition-delay:.4s}

/* --- dock -------------------------------------------------------------- */
.dock{
  position:fixed;left:50%;bottom:22px;z-index:300;
  transform:translateX(-50%) translateY(140%);
  display:flex;align-items:flex-end;gap:10px;padding:10px 14px;
  background:var(--glass);border:1px solid var(--border);border-radius:24px;
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:var(--shadow);
  transition:transform .55s var(--ease),opacity .4s var(--ease);
}
.dock.is-in{transform:translateX(-50%)}
.dock.is-hidden{transform:translateX(-50%) translateY(150%)}
.dock-item{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:transparent;border:0;cursor:pointer;padding:0;
  transition:transform .22s var(--ease);
}
.dock-item .tile{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.02));
  border:1px solid var(--border);color:var(--text);
  transition:border-color .3s,box-shadow .3s,background .3s;
}
.dock-item .tile svg{width:22px;height:22px}
.dock-item.is-active .tile{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),0 0 26px var(--accent-soft)}
.dock-item .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .25s}
.dock-item.is-running .dot{opacity:1}
.dock-item .lbl{font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dock-item .badge{
  position:absolute;top:-4px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--err);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;
}
.dock-item.has-badge .badge{display:flex}
/* Пульс кнопки заказа: та же картинка, но не главным потоком.
   ---------------------------------------------------------------------------
   12.08, замер. Раньше здесь анимировался box-shadow — свойство КРАСКИ.
   Композитор его не умеет, поэтому каждый кадр браузер пересчитывал стиль и
   заново красил плитку. Навсегда. На шестикратно замедленном телефоне это
   стоило 22 процентных пункта из 33 — две трети всей работы лендинга в покое
   уходило на свечение одной кнопки.

   Теперь тень постоянная и лежит на псевдоэлементе, а анимируются только
   opacity и transform — оба композитные, оба не касаются главного потока.
   Масштаб от .92 к 1 сохраняет прежнее ощущение «свет растёт наружу»,
   которое давал рост радиуса размытия: раньше расширялась тень, теперь
   расширяется слой с тенью. Глазу это одно и то же, процессору — нет.

   Замер: 32,9 % → 10,9 % занятости главного потока при ×6. */
.dock-item[data-app="order"] .tile::after{
  /* inset:-1px, а не 0: у плитки есть рамка в пиксель, и старая тень
     отбрасывалась от внешнего края. Псевдоэлемент по внутреннему давал
     ореол на пиксель уже — на пике различие достигало 35 уровней яркости.
     С поправкой пик совпадает попиксельно (средняя разница 0,00). */
  content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 24px 0 var(--accent-soft);
  opacity:0;transform:scale(.92);
  will-change:opacity,transform;
  animation:orderPulse 3.4s ease-in-out infinite;
}
@keyframes orderPulse{0%,100%{opacity:0;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}
/* Раньше этого не было вовсе: пульс шёл и при выключенной анимации. */
@media (prefers-reduced-motion:reduce){.dock-item[data-app="order"] .tile::after{animation:none;opacity:.55;transform:none}}
html[data-anim="paused"] .dock-item[data-app="order"] .tile::after{animation:none;opacity:.55;transform:none}
.dock-item.bounce{animation:dockBounce .62s var(--ease)}
@keyframes dockBounce{0%,100%{transform:translateY(0)}25%{transform:translateY(-16px)}50%{transform:translateY(0)}72%{transform:translateY(-7px)}}
/* The dock hides itself, so the only thing left at the bottom edge is a pill.
   A pill on its own is decoration — the visitor has no reason to read it as a
   handle. So the first time the dock retracts, the pill names what it is
   covering, once, and then gets out of the way for good. Hovering it brings
   the word back, which keeps the hint available without it ever nagging. */
/* Свет под дверью, калибровка по живому OLED. Первая версия была выверена
   по скриншотам с десктопа и на настоящем телефоне давилась в чёрный —
   стеклянная таблетка на чёрном не видна при дневном свете. Теперь это
   уголёк: тёплая линия света и ореол над ней, на явных глиняных значениях,
   а не на полупрозрачных производных. Свет — состояние живого; он честнее
   любого текста говорит: за кромкой что-то есть, дом не выключен. Слово
   «applications» по-прежнему произносится трижды и умолкает — свет
   остаётся, потому что свет не ноет. bottom уважает жестовую зону. */
.dock-hint{
  position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:299;
  width:148px;height:3px;border-radius:999px;border:0;cursor:pointer;padding:0;
  background:linear-gradient(90deg,transparent,var(--seam-line) 28%,var(--seam-line) 72%,transparent);
  opacity:0;pointer-events:none;
  transition:opacity .3s,width .34s var(--ease);
}
.dock-hint.is-shown{opacity:1;pointer-events:auto}
.dock-hint::after{
  content:"";position:absolute;inset:-20px -48px;border-radius:999px;pointer-events:none;
  background:radial-gradient(64% 110% at 50% 100%,var(--seam-glow),transparent 74%);
  opacity:0;transition:opacity .5s ease;
}
.dock-hint.is-shown::after{opacity:.8;animation:seamBreath 6s ease-in-out infinite alternate}
@keyframes seamBreath{from{opacity:.55}to{opacity:.95}}
/* Пальцу нужна дверная ручка крупнее, чем курсору: на грубом указателе сама
   линия шире, а невидимая зона нажатия — с дверную щель. */
@media (pointer:coarse){
  .dock-hint{width:168px;height:3.5px}
  .dock-hint::before{content:"";position:absolute;inset:-26px -40px}
}
@media (prefers-reduced-motion:reduce){.dock-hint.is-shown::after{animation:none;opacity:.7}}
html[data-anim="paused"] .dock-hint.is-shown::after{animation:none;opacity:.7}

/* Сборка дока из точки касания. Иконки не выезжают строем — они разлетаются
   из-под пальца и оседают по своим местам: тот же закон, что у глифов
   подсказки и занавеса ОС — хаос, оседающий в порядок. Порядок посадки
   перетасован, траектории случайны в узких рамках, и оба набора параметров
   рождаются заново при каждом открытии — двух одинаковых открытий не
   существует. Полёт 460 мс, вся посадка < 700 мс: удовольствие, которое
   не успевает стать ожиданием. */
.dock.is-assembling .dock-item{animation:dockLand .46s var(--ease) both;animation-delay:var(--fly-delay,0s)}
@keyframes dockLand{
  0%{opacity:0;transform:translate(var(--fly-x,0px),var(--fly-y,44px)) rotate(var(--fly-r,0deg)) scale(.82)}
  62%{opacity:1}
  100%{opacity:1;transform:none}
}
/* Становление на месте посадки. В полёте плитка несёт не иконку, а один
   глиняный глиф системного словаря; иконкой она становится ровно в момент,
   когда занимает своё место. Одно превращение на предмет — не churn и не
   морфинг: закон занавеса (неразрешённое — глина, разрешённое — своё),
   применённый к предметам. Кастомное свойство --fly-delay наследуется
   внутрь плитки, так что глиф, иконка и полёт живут в одном такте. */
.dock-item .tile{position:relative}
.dock-item .mat{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:15px;color:var(--accent);
  opacity:0;pointer-events:none;user-select:none;
}
.dock.is-materializing .dock-item .tile svg{animation:iconResolve .46s var(--ease) both;animation-delay:var(--fly-delay,0s)}
.dock.is-materializing .dock-item .mat{animation:glyphCarry .46s var(--ease) both;animation-delay:var(--fly-delay,0s)}
@keyframes iconResolve{0%{opacity:0}64%{opacity:0}100%{opacity:1}}
@keyframes glyphCarry{0%{opacity:.92}58%{opacity:.92}88%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .dock.is-assembling .dock-item{animation:none}
  .dock.is-materializing .dock-item .tile svg,.dock.is-materializing .dock-item .mat{animation:none}
}
html[data-anim="paused"] .dock.is-assembling .dock-item{animation:none}
html[data-anim="paused"] .dock.is-materializing .dock-item .tile svg,
html[data-anim="paused"] .dock.is-materializing .dock-item .mat{animation:none}

/* ============================== MOTION IDENTITY v21 =====================
   Вопрос, поставленный основателем: что должно ЧУВСТВОВАТЬСЯ, когда sys.baby
   раскрывает свою систему? Три радикально разных ответа построены как живые
   прототипы (не описания) и судимы рендером. Переключатель ?dockmat= —
   light | develop | wave | both(прежний полёт) — оснастка сравнения.

   Общее для трёх новых ответов: ДОК НЕ ПРИЕЗЖАЕТ. Полка не выезжает снизу —
   транспорт исключён из грамматики; система уже стоит на своём месте, меняется
   только её видимость. Поэтому у режимов отключён transform-переход раскрытия:
   полка оказывается на месте мгновенно и дальше работает свет / проявка /
   перекличка. */
.dock.m-light,.dock.m-develop,.dock.m-wave{transition:opacity .3s var(--ease)}

/* — ОТВЕТ A · «Свет строит» ------------------------------------------------
   Чувство: в тёмной комнате нажали выключатель. Ты касаешься света под
   дверью — и свет разливается от точки касания вдоль кромки; чего он
   коснулся, то оказывается существующим. Ни один предмет не движется:
   двигается только свет. Дом был здесь всегда. */
.dock.m-light{animation:dockBarLit .4s ease-out both}
@keyframes dockBarLit{0%{opacity:0}35%{opacity:.7}100%{opacity:1}}
.dock.m-light .dock-item{animation:dockLit .5s ease-out both;animation-delay:var(--lit-delay,0s)}
@keyframes dockLit{
  0%{opacity:.1;filter:brightness(.35) saturate(.15)}
  55%{opacity:1;filter:brightness(1.42) saturate(1.12)}
  100%{opacity:1;filter:none}
}
/* Привой от «Переклички» (вердикт: интегрируются только победившие органы):
   свет греет то, чего коснулся — метка вспыхивает глиной и остывает до
   служебного серого. Тот же --lit-delay: свет и тепло идут одним фронтом. */
.dock.m-light .dock-item .lbl{animation:lblWarm .6s ease-out both;animation-delay:var(--lit-delay,0s)}
@keyframes lblWarm{
  0%{color:var(--muted);opacity:.25}
  40%{color:var(--accent);opacity:1}
  100%{color:var(--muted)}
}
.dock-flare{
  position:fixed;bottom:16px;transform:translateX(-50%) scaleX(.35);
  width:230px;height:64px;pointer-events:none;z-index:301;
  background:radial-gradient(50% 100% at 50% 100%,rgba(255,150,96,.6),rgba(224,102,60,.26) 42%,transparent 72%);
  filter:blur(7px);opacity:0;
  animation:flareSweep .6s ease-out forwards;
}
@keyframes flareSweep{
  0%{opacity:0;transform:translateX(-50%) scaleX(.35)}
  22%{opacity:.95}
  100%{opacity:0;transform:translateX(-50%) scaleX(6.2)}
}

/* — ОТВЕТ B · «Проявка» ----------------------------------------------------
   Чувство: фотография в кювете проявителя. Все плитки присутствуют сразу —
   как смутные глиняные силуэты — и каждая проявляется в своём темпе:
   резкость, затем собственный цвет. Закон занавеса (неразрешённое — глина,
   разрешённое — своё), применённый не к полёту, а к веществу. Порядок не
   приезжает и не включается. Порядок проявляется. */
.dock.m-develop .dock-item{
  animation:dockDevelop var(--dev-dur,.6s) cubic-bezier(.3,.05,.25,1) both;
  animation-delay:var(--dev-delay,0s);
}
@keyframes dockDevelop{
  0%{opacity:.16;filter:blur(7px) grayscale(1) sepia(.85) hue-rotate(-14deg) saturate(2.1) brightness(.7)}
  55%{opacity:.85;filter:blur(1.6px) grayscale(.45) sepia(.4) hue-rotate(-9deg) saturate(1.4) brightness(.92)}
  100%{opacity:1;filter:none}
}

/* — ОТВЕТ C · «Перекличка» -------------------------------------------------
   Чувство: машина отвечает на вызов. От точки касания по строю бежит волна
   включения — каждая плитка коротко «щёлкает» (лёгкий перелёт масштаба,
   кольцо акцента, метка вспыхивает глиной и остывает до служебного серого),
   строго по порядку удаления. Не случайность — причинность: ты позвал,
   и каждый ответил «здесь». */
.dock.m-wave .dock-item{animation:dockWave .3s var(--ease) both;animation-delay:var(--wave-delay,0s)}
@keyframes dockWave{
  0%{opacity:0;transform:scale(.86)}
  55%{opacity:1;transform:scale(1.07)}
  100%{opacity:1;transform:none}
}
.dock.m-wave .dock-item .tile{animation:dockWaveRing .34s ease-out both;animation-delay:var(--wave-delay,0s)}
@keyframes dockWaveRing{
  0%{box-shadow:0 0 0 0 rgba(224,102,60,0)}
  45%{box-shadow:0 0 0 5px rgba(224,102,60,.3),0 0 18px rgba(224,102,60,.22)}
  100%{box-shadow:0 0 0 0 rgba(224,102,60,0)}
}
.dock.m-wave .dock-item .lbl{animation:lblStamp .42s ease-out both;animation-delay:var(--wave-delay,0s)}
@keyframes lblStamp{
  0%{color:var(--accent);opacity:.2}
  45%{color:var(--accent);opacity:1}
  100%{color:var(--muted)}
}

@media (prefers-reduced-motion:reduce){
  .dock.m-light,.dock.m-light .dock-item,.dock.m-light .dock-item .lbl,
  .dock.m-develop .dock-item,
  .dock.m-wave .dock-item,.dock.m-wave .dock-item .tile,.dock.m-wave .dock-item .lbl{animation:none}
  .dock-flare{display:none}
}
html[data-anim="paused"] .dock.m-light,html[data-anim="paused"] .dock.m-light .dock-item,
html[data-anim="paused"] .dock.m-light .dock-item .lbl,
html[data-anim="paused"] .dock.m-develop .dock-item,
html[data-anim="paused"] .dock.m-wave .dock-item,
html[data-anim="paused"] .dock.m-wave .dock-item .tile,
html[data-anim="paused"] .dock.m-wave .dock-item .lbl{animation:none}
html[data-anim="paused"] .dock-flare{display:none}

/* Метка «applications» удалена в v20.8: слово было лишним —
   свет под дверью говорит сам. */

/* --- windows ----------------------------------------------------------- */
.window-layer{position:fixed;inset:0;z-index:200;pointer-events:none}
/* The title bar and the resize corner are drag handles, so the browser must
   not claim the gesture as a pan — without this the first millimetre of a
   finger movement ends the drag before it starts. */
.win-bar,.win-resize{touch-action:none}
::selection{background:var(--accent-soft);color:var(--text)}
.win{
  position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  background:var(--win);border:1px solid var(--border);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(58px) saturate(190%);-webkit-backdrop-filter:blur(58px) saturate(190%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
}
.win.is-focused{border-color:var(--accent-soft);box-shadow:var(--shadow),0 0 0 1px var(--accent-soft),0 0 40px var(--seam-haze)}
.win.is-animating{transition:transform .48s var(--ease),opacity .4s var(--ease),width .4s var(--ease),height .4s var(--ease),left .4s var(--ease),top .4s var(--ease)}
.win-bar{
  display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;flex:none;cursor:default;
  background:var(--win-strong);border-bottom:1px solid var(--border);user-select:none;
}
/* Window controls. Three coloured dots belong to somebody else's operating
   system; this is one graphite cluster of glyph keys, legible without hover —
   which matters, because on a phone there is no hover at all. Close is the
   only one that takes colour, and only under the pointer. */
.lights{display:flex;align-items:center;gap:2px;padding:2px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid var(--border)}
.light{width:22px;height:18px;border-radius:7px;border:0;cursor:pointer;padding:0;display:grid;place-items:center;background:transparent;color:var(--muted);font-size:11px;line-height:1;transition:background .14s,color .14s}
.light span{opacity:1}
.light:hover,.light:focus-visible{background:var(--glass);color:var(--text)}
.light-close:hover,.light-close:focus-visible{background:rgba(255,69,58,.18);color:#ff6a60}
.win.is-focused .lights{background:rgba(255,255,255,.07)}
.win-title{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.win-body{flex:1;overflow:auto;padding:22px 24px 26px;font-size:13.5px;line-height:1.6;color:var(--muted);-webkit-overflow-scrolling:touch}
.win-resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.win-resize::after{content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;border-right:1.5px solid var(--border);border-bottom:1.5px solid var(--border)}
.snap-preview{position:fixed;z-index:199;border:1.5px dashed var(--accent-soft);border-radius:14px;background:var(--seam-haze);pointer-events:none;display:none}
.snap-preview.is-shown{display:block}

/* --- panel content ----------------------------------------------------- */
.win-body h3{margin:0 0 12px;font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.win-body p{margin:0 0 14px}
.panel-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.panel-list li{position:relative;padding-left:16px}
.panel-list li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7}
.panel-list li.plain::before{display:none}
.panel-list li.plain{padding-left:0}
.case-goal{color:var(--text);font-weight:600}
.case-meta{font-size:12px}
.case-result{color:var(--text);margin-top:6px;display:block}
.case-note{font-size:11.5px;opacity:.72}
/* work in approval (§16) — a rule and a numeral, not another case entry: the
   list above it is things that exist and can be opened, and this is not one */
.case-pipeline{border-top:1px solid var(--border);padding-top:14px;margin-top:6px}
.case-pipe-count{
  font-family:var(--mono);font-size:22px;font-weight:300;line-height:1;
  color:var(--text);margin-right:10px;font-variant-numeric:tabular-nums;
}
.case-pipe-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);
}
.case-pipeline .case-note{display:inline-block;margin-top:6px}

/* introductions (§3) — the quiet layer.
   No card, no bordered box, no accent fill: a rule and a paragraph, the same
   way work-in-approval is drawn above. If this ever starts to look like a
   banner, the design has stopped saying what the copy says. */
.attn{margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}
.attn-head{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.attn-body{margin:0;font-size:13px;line-height:1.65;color:var(--muted);max-width:62ch}
/* A link, not a button. Wanting to pass work on is not a conversion. */
.attn-act{
  margin-top:12px;padding:0;border:0;background:none;cursor:pointer;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--accent);
  border-bottom:1px solid transparent;transition:border-color .2s ease;
}
.attn-act:hover,.attn-act:focus-visible{border-bottom-color:var(--accent)}
.attn-tool{margin-top:14px}
.attn-label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.attn-row{display:flex;gap:8px;flex-wrap:wrap}
.attn-input{
  flex:1 1 200px;min-width:0;padding:9px 11px;border-radius:10px;
  border:1px solid var(--border);background:var(--glass);color:var(--text);
  font-size:13px;font-family:inherit;
}
.attn-input:focus{outline:none;border-color:var(--accent-soft)}
/* iOS zooms the page for any field under 16px, which throws the window off
   screen mid-typing. The size is the fix; there is no other one. */
@media (max-width:820px){ .attn-input{font-size:16px} }
.attn-copy{
  flex:none;padding:9px 13px;border-radius:10px;cursor:pointer;
  border:1px solid var(--border);background:var(--glass);color:var(--text);font-size:12.5px;
}
.attn-copy:hover{border-color:var(--accent-soft)}
.attn-link{
  margin:10px 0 0;font-family:var(--mono);font-size:11.5px;line-height:1.5;
  color:var(--muted);word-break:break-all;
}
.attn-fine{margin:10px 0 0;font-size:11.5px;line-height:1.6;color:var(--muted);opacity:.78;max-width:58ch}
/* phone: the copy button owns its own line rather than squeezing the field */
@media (max-width:520px){ .attn-copy{flex:1 1 100%} }

/* SYS CARE — the continuation, not a price list.
   No grid, no columns, no "most popular". Two levels stated plainly, the same
   restraint the portfolio uses for its own states. If this ever needs a table
   to be understood, the copy is wrong, not the layout. */
.care{margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}
.care-title{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.care-lead{margin:0 0 16px;font-size:13px;line-height:1.65;color:var(--muted);max-width:62ch}
.care-level{margin-bottom:14px}
.care-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.care-name{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
.care-from{font-family:var(--mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
.care-body{margin:5px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted);max-width:62ch}
.care-foot{margin:16px 0 0;font-size:11.5px;line-height:1.6;color:var(--muted);opacity:.78;max-width:58ch}

.link-row{margin-top:18px}
.link-row a{color:var(--accent);font-weight:600;text-decoration:none}
.note-block{display:flex;gap:10px;align-items:flex-start;margin:18px 0;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--glass)}
.note-block svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.note-block .note-text{font-size:12.5px;line-height:1.6}
.note-block .note-text strong{color:var(--text)}
.steps{margin:20px 0 4px}
.steps h4{margin:0 0 12px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text)}
.steps ol{margin:0;padding:0;list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:11px}
.steps li{counter-increment:step;position:relative;padding-left:30px;font-size:12.5px}
.steps li::before{
  content:counter(step);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:var(--accent);
}
.steps .after{margin-top:14px;font-size:12px}

/* --- order: packages + form -------------------------------------------- */
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.pkg{
  position:relative;text-align:left;cursor:pointer;padding:16px 14px 18px;
  background:var(--glass);border:1px solid var(--border);border-radius:16px;color:inherit;
  transition:border-color .3s,box-shadow .3s,transform .3s var(--ease);
}
.pkg:hover{transform:translateY(-2px)}
.pkg.is-selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),0 0 30px var(--seam-haze)}
.pkg .badge-line{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.pkg .pkg-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}
.pkg .pkg-price{font-family:var(--mono);font-size:15px;color:var(--text)}
.pkg .pkg-period{font-size:11px;color:var(--muted);margin-left:6px}
.pkg ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.pkg li{font-size:11.5px;line-height:1.45;padding-left:13px;position:relative}
.pkg li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.6}
.order-form{margin-top:22px;display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{
  width:100%;padding:11px 13px;font-size:13.5px;border-radius:12px;
  background:rgba(127,127,140,.10);border:1px solid var(--border);color:var(--text);
  transition:border-color .25s,box-shadow .25s;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--seam-haze)}
.field input[readonly]{color:var(--muted);cursor:default}
.field textarea{resize:vertical;min-height:76px;line-height:1.5}
.field .help{font-size:11px;color:var(--muted);line-height:1.5}
.submit-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:2px}
.submit-row .hint{font-size:11px;color:var(--muted);line-height:1.5;flex:1;min-width:180px}
.btn-submit{border-radius:999px;padding:13px 24px;font-size:13.5px;font-weight:600;border:0;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg)}
.btn-submit[disabled]{opacity:.55;cursor:progress}
.form-status{font-size:12.5px;line-height:1.6;min-height:18px}
.form-status .ok-title{color:var(--ok);font-weight:700;display:block;margin-bottom:6px}
.form-status .err-title{color:var(--err-bold);font-weight:700;display:block;margin-bottom:6px}
.form-status .line{display:block;margin-bottom:6px}
.form-status .dim{color:var(--muted)}
.form-status .txt{color:var(--text)}
.form-status .rescue{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}
.form-status .rescue a,.form-status .rescue button{
  border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;
  border:1px solid var(--border);background:var(--glass);color:var(--text);
}
.form-status .rescue a{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}

/* --- roi --------------------------------------------------------------- */
.roi-anchor{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 18px;font-size:12.5px;line-height:1.6}
.slider{margin:16px 0}
.slider .s-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.slider .s-label{font-size:12.5px;color:var(--text)}
.slider .s-hint{font-size:11px;color:var(--muted);display:block}
.slider .s-out{font-family:var(--mono);font-size:14px;color:var(--accent);white-space:nowrap}
.slider input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:rgba(127,127,140,.28);outline:none}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 14px var(--accent-soft)}
.slider input[type=range]::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;background:var(--accent);cursor:pointer}
.roi-results{margin-top:22px;display:flex;flex-direction:column;gap:16px;transition:opacity .3s}
.roi-results.is-dimmed{opacity:.62}
.roi-fig .f-label{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.roi-fig .f-value{font-family:var(--mono);font-size:29px;font-weight:600;color:var(--text);line-height:1.2;margin-top:3px}
.roi-fig .f-unit{font-size:15px;color:var(--muted)}
.roi-fig .f-sub{font-size:11.5px;line-height:1.55;margin-top:5px}
.roi-fig .f-sub.is-warn{color:var(--text)}
.roi-cta{margin-top:22px;width:100%}

/* --- chat -------------------------------------------------------------- */
.chat{display:flex;flex-direction:column;height:100%}
.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);flex:none}
.chat-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--mono);color:var(--accent);background:var(--glass);border:1px solid var(--accent-soft)}
.chat-head .who{font-size:13px;font-weight:600;color:var(--text)}
.chat-head .st{font-size:10.5px;color:var(--muted)}
.chat-msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 2px}
.bubble{max-width:86%;padding:10px 12px;border-radius:14px;font-size:12.5px;line-height:1.5;word-wrap:break-word}
.bubble .time{display:block;margin-top:5px;font-family:var(--mono);font-size:9.5px;opacity:.6}
.from-agent{align-self:flex-start;background:var(--glass);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:5px}
.from-user{align-self:flex-end;background:var(--accent);color:var(--void);border-bottom-right-radius:5px}
[data-theme="light"] .from-user{color:#fff}
.typing{align-self:flex-start;display:flex;gap:4px;padding:11px 13px;background:var(--glass);border:1px solid var(--border);border-radius:14px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:typeDot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes typeDot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-input{flex:none;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.chat-input input.mail{background:transparent;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:7px 2px;font-size:12.5px}
.chat-input input.mail:focus{outline:none;border-bottom-color:var(--accent)}
.chat-send-row{display:flex;align-items:flex-end;gap:8px}
.chat-send-row textarea{
  flex:1;resize:none;max-height:80px;min-height:34px;padding:9px 12px;font-size:12.5px;line-height:1.4;
  background:rgba(127,127,140,.10);border:1px solid var(--border);border-radius:12px;color:var(--text);
}
.chat-send-row textarea:focus{outline:none;border-color:var(--accent-soft)}
.chat-send{width:34px;height:34px;flex:none;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:var(--void);display:flex;align-items:center;justify-content:center}
.chat-send svg{width:15px;height:15px}

/* --- toasts ------------------------------------------------------------ */
.toasts{position:fixed;top:56px;right:16px;z-index:600;display:flex;flex-direction:column;gap:10px;width:300px;pointer-events:none}
.toast{
  pointer-events:auto;cursor:pointer;display:flex;gap:11px;padding:13px;border-radius:14px;
  background:var(--win-strong);border:1px solid var(--border);box-shadow:var(--shadow);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  transform:translateX(120%);opacity:0;transition:transform .45s var(--ease),opacity .45s var(--ease);
}
.toast.is-in{transform:none;opacity:1}
/* На телефоне тосты уходят вниз, к доку: правый верхний угол — это первая
   строка заголовка, и приветствие чата закрывало собой самый дорогой текст
   страницы ровно на 6.2 секунды первого впечатления. Наблюдалось на
   скриншотах трибунала, а не предположено. */
@media (max-width:560px){
  .toasts{top:auto;bottom:calc(var(--dock-h,90px) + 14px);left:12px;right:12px;width:auto}
}
.toast .ic{width:30px;height:30px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);color:var(--accent)}
.toast .ic svg{width:15px;height:15px}
.toast .t-title{font-size:12px;font-weight:700;color:var(--text)}
.toast .t-body{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}

/* --- control center ---------------------------------------------------- */
.cc{
  position:fixed;top:52px;right:20px;z-index:500;width:262px;padding:14px;
  background:var(--win-strong);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  display:none;
}
.cc.is-open{display:block}
.cc .cc-title{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc-toggle{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:11px 10px;cursor:pointer;
  background:var(--glass);border:1px solid var(--border);border-radius:13px;color:var(--muted);text-align:left;font-size:10.5px;line-height:1.3;
  transition:background .25s,color .25s,border-color .25s;
}
.cc-toggle .knob{width:22px;height:22px;border-radius:7px;background:rgba(127,127,140,.24);display:flex;align-items:center;justify-content:center}
.cc-toggle .knob svg{width:12px;height:12px}
.cc-toggle[aria-pressed="true"]{color:var(--text)}
.cc-toggle[data-key="sound"][aria-pressed="true"] .knob{background:var(--cc-sound);color:#fff}
.cc-toggle[data-key="motion"][aria-pressed="true"] .knob{background:var(--cc-motion);color:#fff}
.cc-toggle[data-key="autohide"][aria-pressed="true"] .knob{background:var(--cc-autohide);color:#fff}
.cc-toggle[data-key="dnd"][aria-pressed="true"] .knob{background:var(--cc-dnd);color:#fff}
.cc-slider{margin-top:12px}
.cc-slider .cap{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.cc-slider input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:rgba(127,127,140,.3)}
.cc-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);cursor:pointer}
.cc-slider input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--text);cursor:pointer}
[data-dnd="on"] .cc-slider.vol input[type=range]::-webkit-slider-thumb{background:var(--muted);opacity:.55}
[data-dnd="on"] .cc-slider.vol input[type=range]::-moz-range-thumb{background:var(--muted);opacity:.55}

/* --- command palette --------------------------------------------------- */
.palette{position:fixed;inset:0;z-index:700;display:none}
.palette.is-open{display:block}
.palette .pal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.palette .pal-box{
  position:absolute;top:16vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);
  background:var(--win-strong);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
}
.pal-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.pal-top svg{width:15px;height:15px;color:var(--muted);flex:none}
.pal-top input{flex:1;background:transparent;border:0;font-size:15px;color:var(--text)}
.pal-top input:focus{outline:none}
.pal-list{max-height:46vh;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left}
.pal-item.is-cur{background:var(--glass)}
.pal-item .p-ic{width:26px;height:26px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--accent)}
.pal-item .p-ic svg{width:13px;height:13px}
.pal-item .p-title{font-size:13px;color:var(--text)}
.pal-item .p-sub{font-size:11px;color:var(--muted)}
.pal-empty{padding:20px 14px;font-size:12.5px;color:var(--muted);text-align:center}
.pal-hints{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);letter-spacing:.4px}

function $(sel, root) { return (root || document).querySelector(sel); }
function el(id) { return document.getElementById(id); }

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
  });
}

/* Authored copy only (SB_CONTENT / portfolio data) — see escaping note. */
function setHtml(node, html) { node.innerHTML = html; }

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function osReducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function motionOff() { return state.prefs.motion || osReducedMotion(); }

function appCopy(app, lang) { return C.appData[app][lang || state.lang]; }
function locale() { return C.localeMap[state.lang] || "en-GB"; }

function makeEl(tag, cls, html) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html != null) node.innerHTML = html;
  return node;
}

/* ЭКРАН ЗАГРУЗКИ УДАЛЁН.
   -------------------------------------------------------------------------
   Здесь проигрывался журнал из восьми строк: «Verifying system integrity»,
   «Allocating memory», «Establishing secure connection», «Authenticating
   session» и далее. Ни одна из них не происходила. Это был вымысел о работе
   системы — ровно то, что проект запрещает себе в отношении клиентов.

   Но дело даже не в правиле. Ожидание, пока чужая система «аутентифицирует
   сессию», — это эстетика арендованного софта: ты стоишь у двери, пока тебя
   впускают. Система, которая тебе принадлежит, просто есть. Поэтому первое
   доказательство философии — не текст на странице, а то, что здесь нечего
   ждать.

   Узел #boot и метка is-done сохранены: на этот контракт опираются
   наборы проверок. Сохранён контракт, удалено переживание — вместе со всей
   машинерией ячеек, журнала и сети, которая больше никогда не вызывалась. */
var boot = { overlay: el("boot"), done: false, stopNet: null };

function finishBoot() {
  if (boot.done) return;
  boot.done = true;
  if (boot.stopNet) boot.stopNet();
  boot.overlay.classList.add("is-done");
  /* Задержки ниже были рассчитаны на девятисекундную увертюру, которой больше
     нет. Оставить их — значит заменить поддельную загрузку поддельной паузой.
     Среда собирается за один кадр; лестница сохранена только там, где она
     объясняет, откуда взялся элемент, и укорочена до порога заметности. */
  boot.overlay.style.display = "none";
  el("topbar").classList.add("is-in");
  el("dock").classList.add("is-in");
  Array.prototype.forEach.call(el("dock").children, function (item, i) {
    item.style.opacity = "0";
    item.style.transform = "translateY(6px)";
    setTimeout(function () {
      item.style.transition = "opacity var(--d-base) var(--enter), transform var(--d-base) var(--enter)";
      item.style.opacity = "1";
      item.style.transform = "none";
    }, 40 + i * 26);
  });
  el("hero").classList.add("is-revealed");
  setTimeout(function () { state.booted = true; armAutoHide(); }, 600);
  setTimeout(chatWelcomePush, 3400);
}

function setLang(lang) {
  if (LANGS.indexOf(lang) === -1) return;
  state.lang = lang;
  document.documentElement.setAttribute("lang", DOC_LANG[lang]);
  /* The OS reads this key on boot, so whichever language is chosen here is

     system, not two. */
  try { window.localStorage.setItem("sysbaby.i18n.lang", lang); } catch (err) { /* storage blocked */ }

    btn.classList.toggle("is-active", btn.getAttribute("data-lang") === lang);
  });
