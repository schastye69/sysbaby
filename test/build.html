  } catch (err) { /* storage blocked */ }
  renderHero();
  renderHeroProof();          /* the proof line is portfolio prose: it translates too */
  renderDockLabels();
  el("cmdkTriggerLabel").textContent = C.cmdkLabels[lang].triggerLabel;
  APPS.forEach(function (app) { if (wins[app]) renderWindow(app); });
  APPS.forEach(function (app) { if (wins[app]) wins[app].titleEl.textContent = appCopy(app).title; });
  updateAppName();
  Array.prototype.forEach.call(el("langs").children, function (btn) {
    var on = btn.getAttribute("data-lang") === lang;
    if (on && !btn.classList.contains("is-active") && !motionOff()) {
      btn.classList.add("is-warm");
      setTimeout(function () { btn.classList.remove("is-warm"); }, 60);
    }
    btn.classList.toggle("is-active", on);
  });
  if (state.palette.open) renderPalette();
}

function cycleLang() {
  var order = ["en", "ru", "ee"];
  setLang(order[(order.indexOf(state.lang) + 1) % order.length]);
}

/* ------------------------------------------------------------------ hero */

function heroTitleHtml(lang) {
  /* Раньше здесь по буквам собиралось слово BABY со своим градиентом. Градиент
     был удалён задолго до этого прохода — устройство осталось невидимым кодом.
     Заголовок говорит одним голосом на всех языках. */
  return esc(C.translations[lang].hero_title);
}

/* The longest word decides the size of the headline — see .hero h1.
   The word is measured rather than estimated: character counts lie across
   scripts, and Cyrillic at weight 900 is wider per character than Latin. A
   probe is laid out at 100px in the headline's own face, its width gives an
   exact advance ratio, and the fit is the size at which the word spans the
   line and no more. Re-measured on every language change and every resize. */
var heroLongestWord = "";

function applyHeroMeasure(title) {
  var host = el("heroTitle");
  if (!host) return;
  var longest = "";
  String(title).split(/\s+/).forEach(function (word) {
    var plain = word.replace(/<[^>]*>/g, "");
    if (plain.length > longest.length) longest = plain;
  });
  heroLongestWord = longest;
  host.style.setProperty("--hero-chars", String(Math.max(8, longest.length)));
  measureHeroFit();
}

function measureHeroFit() {
  var host = el("heroTitle");
  if (!host || !heroLongestWord) return;
  var style = window.getComputedStyle(host);
  var probe = makeEl("span");
  probe.textContent = heroLongestWord;
  probe.style.cssText =
    "position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;" +
    "font-family:" + style.fontFamily + ";font-weight:" + style.fontWeight +
    ";letter-spacing:" + style.letterSpacing + ";font-size:100px";
  document.body.appendChild(probe);
  var ratio = probe.getBoundingClientRect().width / 100;
  document.body.removeChild(probe);
  if (!ratio) return;
  /* The line the word has to live inside, minus a hair so a heavy glyph's
     right side-bearing never kisses the edge. */
  var room = host.getBoundingClientRect().width - 2;
  if (room <= 0) return;
  var fit = Math.floor(room / ratio);
  /* Below this the headline stops being a headline. Past that point the word
     breaks rather than shrinks — see .hero h1.is-tight. */
  host.classList.toggle("is-tight", fit < 38);
  host.style.setProperty("--hero-fit", fit + "px");
}

/* Пара командных клавиш: ширину держит макет, кегль подбирается измерением —
   тот же подход, что fitHeroName(). Подписи четырёх языков разной длины,
   а клавиши обязаны быть одного размера на всех языках: если подписи тесно,
   пара сжимает кегль ОБЕИМИ клавишами сразу — пульт говорит одним
   размером, — но не ниже пола в 11px. Русская подпись здесь однажды была
   «Бесплатная оценка проекта» и не входила в клавишу телефона даже полом
   кегля — Совет сократил её, а не вёрстку: см. ответ основателю от
   17.08.2026. Охраняется tools/cta-check.mjs. */
function fitCtaRow() {
  var row = document.querySelector(".cta-row");
  if (!row) return;
  var keys = [el("ctaRequest"), el("ctaExplore")];
  if (!keys[0] || !keys[1] || !keys[0].querySelector(".btn-label")) return;
  var BASE = 14, FLOOR = 11, GUARD = 2;
  row.style.setProperty("--cta-fs", BASE + "px");
  var scale = 1;
  keys.forEach(function (b) {
    var lb = b.querySelector(".btn-label");
    var cs = getComputedStyle(b);
    var room = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - GUARD;
    /* Соседи подписи в клавише (точка и зазор) место не отдают. */
    var dot = b.querySelector(".btn-live");
    if (dot) room -= dot.getBoundingClientRect().width + (parseFloat(cs.columnGap) || 9);
    /* Ширина берётся у ТЕКСТА (Range), а не у коробки узла: коробку CSS
       может ужать, и подгон стал бы мерить сжатие вместо подписи —
       этот дефект уже случался и пойман законом. */
    var rng = document.createRange();
    rng.selectNodeContents(lb);
    var need = 0, rects = rng.getClientRects();
    for (var i = 0; i < rects.length; i++) need += rects[i].width;
    if (need > 0 && room > 0) scale = Math.min(scale, room / need);
  });
  if (scale < 1) {
    row.style.setProperty("--cta-fs",
      Math.max(FLOOR, Math.floor(BASE * scale * 2) / 2) + "px");
  }
}

function renderHero() {
  var t = C.translations[state.lang];
  setHtml(el("heroTitle"), heroTitleHtml(state.lang));
  applyHeroMeasure(C.translations[state.lang].hero_title);
  setHtml(el("heroText"), t.hero_text);
  /* Подпись живёт в .btn-label — по ней меряет fitCtaRow() и закон.
     На клавише ОС перед подписью — живая точка (система не закрывается). */
  setHtml(el("ctaRequest"), '<span class="btn-label">' + esc(t.cta_request) + "</span>");
  setHtml(el("ctaExplore"),
    '<i class="btn-live" aria-hidden="true"></i><span class="btn-label">' + esc(t.cta_explore) + "</span>");
  renderHeroSpec();
  fitHeroName();
  fitCtaRow();
  setHtml(el("exploreNote"), t.explore_note);
  setHtml(el("heroNoteText"), t.hero_note);
}

/* Вся ценовая лестница — на первом экране, тремя фактами. Числа приходят
   из SB_PRICING, срок и имя пакета — из appData.order.packages[0]: нет
   источника — нет строки, выдуманного числа здесь быть не может. Ярлык
   «все пакеты» у цены обязателен: без него срок первого пакета и цена всей
   лестницы читаются как одно обещание. Эту ошибку Совет уже допускал.
   Охраняется tools/facts-source-check.mjs. */
function renderHeroSpec() {
  var node = el("heroSpec");
  if (!node) return;
  var lang = state.lang;
  var s = C.heroSpec[lang] || C.heroSpec.en;
  var order = C.appData.order[lang] || C.appData.order.en;
  var pk = order && order.packages && order.packages[0];
  if (!PRICING || typeof PRICING.fullBand !== "function" || !pk) {
    node.innerHTML = "";
    node.style.display = "none";
    return;
  }
  node.style.display = "";
  function cell(label, value, cls) {
    return '<div class="spec-cell' + (cls ? " " + cls : "") + '">' +
      "<em>" + esc(label) + "</em><b>" + esc(value) + "</b></div>";
  }
  setHtml(node,
    cell(pk.name, pk.period) +
    cell(s.priceLabel, PRICING.fullBand(lang)) +
    cell(s.ownLabel, s.ownValue, "is-own"));
}

/* Надстрочник по ширине заголовка. Ширина набора линейна по трекингу:
   W(ls) = base + N*ls, поэтому нужный трекинг берётся одним уравнением, без
   подбора. Не хватает места даже на минимальном трекинге — уменьшается
   кегль, но только после трекинга. Цель — самая длинная СТРОКА заголовка:
   заголовок переносится сам и по-разному в каждом из четырёх языков. */
function fitHeroName() {
  var eb = el("heroName"), h1 = el("heroTitle");
  if (!eb || !h1 || !h1.firstChild) return;
  var ws = eb.querySelectorAll(".w");
  if (!ws.length) return;
  eb.style.width = ""; eb.style.fontSize = "";
  eb.style.letterSpacing = "0px"; eb.style.setProperty("--hn-ls", "0px");
  var r = document.createRange(); r.selectNodeContents(h1);
  var rects = [], i;
  var list = r.getClientRects();
  for (i = 0; i < list.length; i++) if (list[i].width > 1) rects.push(list[i]);
  if (!rects.length) return;
  var target = rects[0].width;
  for (i = 1; i < rects.length; i++) if (rects[i].width > target) target = rects[i].width;
  var cs = getComputedStyle(eb), fs = parseFloat(cs.fontSize);
  var gaps = (ws.length - 1) * (parseFloat(cs.columnGap) || 0);
  var chars = eb.textContent.replace(/\s+/g, "").length;
  var base = 0;
  for (i = 0; i < ws.length; i++) base += ws[i].getBoundingClientRect().width;
  if (!chars || !target) return;
  /* Потолок трекинга поднят до 0.95em: при русском заголовке на 768px
     остаток уходил в межсловные зазоры (53px) и строка выглядела разорванной.
     v43: финский заголовок длиннее русского, и на 1600–1920 потолок 0.95em
     снова отдавал остаток пробелам — поднят до 1.25em.
     Равномерная разрядка честнее раздутых пробелов — сначала буквы, и только
     потом пробелы. Порог держит tools/hero-fit-check.mjs. */
  var LS_MIN = 0.4, LS_MAX = fs * 1.25;
  var ls = (target - base - gaps) / chars;
  if (ls < LS_MIN) {
    var k = (target - gaps) / (base + LS_MIN * chars);
    eb.style.fontSize = (fs * Math.max(0.62, k)).toFixed(2) + "px";
    ls = LS_MIN;
  } else if (ls > LS_MAX) ls = LS_MAX;
  eb.style.letterSpacing = ls.toFixed(3) + "px";
  eb.style.setProperty("--hn-ls", ls.toFixed(3) + "px");
  eb.style.width = target.toFixed(2) + "px";
}
window.sbFitHeroName = fitHeroName;

/* Hero proof: rendered once, at load, in the load-time language (spec §7). */
function renderHeroProof() {
  if (!window.sbPortfolio || !window.sbPortfolioView) return;
  var lang = state.lang;
  for (var i = 0; i < window.sbPortfolio.length; i++) {
    var entry = window.sbPortfolio[i];
    if (entry && entry.visibility === "private") continue;
    var view = window.sbPortfolioView(entry, lang);
    if (view.resultsState !== "measured" || !view.results) continue;
    el("heroProofMain").textContent = view.results;
    /* ОБЛАСТЬ ДЕЙСТВИЯ ЦИФРЫ. Замер сделан в ОДНОЙ отрасли — авторемонтной
       покраске. Без названия отрасли «час превратился в 15 минут» читается
       как обещание всем и каждому: два верных факта, стоящих рядом, снова
       дают обещание, которого никто не давал. Отрасль берётся из вида
       портфолио, а не вписывается руками, и потому не разойдётся с делом.
       Тот же приём уже применён в окне окупаемости: «в одной поставленной
       системе». Охраняется tools/facts-source-check.mjs. */
    var src = [];
    if (view.industry) src.push(view.industry);
    if (view.resultsSource === "first-hand") {
      src.push(C.heroProofSourceLine[lang] || C.heroProofSourceLine.en);
    }
    el("heroProofSrc").textContent = src.join(" · ");
    el("heroProof").classList.add("is-shown");
    return;
  }
  /* No qualifying entry: the block stays hidden. Never substitute copy. */
}

/* ------------------------------------------------------------------ dock */

function buildDock() {
  var dock = el("dock");
  dock.innerHTML = "";
  APPS.forEach(function (app) {
    var btn = makeEl("button", "dock-item");
    btn.setAttribute("data-app", app);
    btn.setAttribute("aria-label", S.ariaLabels.dockApps[app]);
    setHtml(btn,
      '<span class="badge">1</span>' +
      '<span class="tile">' + svg(app) + "</span>" +
      '<span class="dot"></span>' +
      '<span class="lbl"></span>');
    btn.addEventListener("click", function () {
      bounce(btn);
      showDock();
      if (app === "chat") clearChatBadge();
      openApp(app);
    });
    dock.appendChild(btn);
    dockItems[app] = btn;
  });
  renderDockLabels();
}

function renderDockLabels() {
  APPS.forEach(function (app) {
    $(".lbl", dockItems[app]).textContent = appCopy(app).label;
  });
}

function bounce(btn) {
  btn.classList.remove("bounce");
  void btn.offsetWidth;
  btn.classList.add("bounce");
  setTimeout(function () { btn.classList.remove("bounce"); }, 640);
}

function refreshDockState() {
  APPS.forEach(function (app) {
    var btn = dockItems[app];
    btn.classList.toggle("is-running", !!wins[app]);
    btn.classList.toggle("is-active", state.focused === app && !!wins[app]);
  });
}

/* dock magnification — pointer devices, motion on */
function dockMagnify(ev) {
  if (motionOff() || window.innerWidth <= 620) return;
  APPS.forEach(function (app) {
    var btn = dockItems[app];
    var rect = btn.getBoundingClientRect();
    var dist = Math.abs(ev.clientX - (rect.left + rect.width / 2));
    var scale = dist < 110 ? 1 + 0.5 * (1 - dist / 110) : 1;
    btn.style.transform = "translateY(" + (-14 * (scale - 1)) + "px) scale(" + scale + ")";
  });
}
function dockMagnifyReset() {
  APPS.forEach(function (app) { dockItems[app].style.transform = ""; });
}

/* Машинерия слова «applications» удалена в v20.8 — свет под дверью
   оказался достаточной подсказкой, а слово рядом с ним стало лишним.
   Удалено, не спрятано: счётчик трёх произнесений, сборка метки из
   глифов и её стили ушли вместе с разметкой. Словарь HINT_GLYPHS живёт —
   им пишут пульс строки-имени и становление плиток дока. */
var HINT_GLYPHS = "0123456789abcdef/<>{}[]()=+-_:.|";

/* ------------------------------------------------ пульс строки-имени */
/* Инициалы B·A·B·Y изредка ведут себя так, будто система под страницей
   жива: один инициал на полсекунды расседается в глифы того же словаря,
   которым пишет подсказка дока, и оседает обратно, остывая из глины.

   Правила хаоса-в-системе:
   — один инициал за раз, никогда два; подряд один и тот же — никогда;
   — интервалы нерегулярны (9–22 c), первый пульс не раньше 14 c: строка
     обязана сначала быть прочитана как текст и только потом ожить;
   — 5–8 кадров по 72 мс — «подождите, буква только что менялась?»
     длится меньше секунды и не успевает стать зрелищем;
   — между пульсами не работает ничего: один setTimeout, ни одного rAF;
   — скрытая вкладка молчит; reduced-motion и пауза анимаций проверяются
     при каждом пульсе через motionOff(), а не один раз на старте;
   — моноширинный шрифт делает подмену безразмерной: ни сдвига строки,
     ни CLS — глиф занимает ровно клетку буквы;
   — для скринридера пульса не существует: разметка живёт под
     aria-hidden, полный текст — в aria-label родителя. */
var namePulse = { timer: null, last: -1, busy: false };
function scheduleNamePulse(first) {
  clearTimeout(namePulse.timer);
  /* Темп поднят втрое по полевому наблюдению основателя: на прежних
     9–22 c большинство посетителей не успевало застать ни одного пульса.
     Теперь 2.8–6.8 c, и в ~15% случаев пауза удлиняется вдвое — периоды
     полной тишины сохранены и на быстром темпе, чтобы ритм не стал
     метрономом. Первый пульс — на 5-й секунде: заголовок к этому моменту
     прочитан, строка-имя ещё в поле зрения. */
  /* Второе полевое ускорение: и 2.8–6.8 c на живом экране читались как
     «почти никогда». Теперь 0.9–2.4 c — строка ощутимо жива, но пульс
     по-прежнему один инициал и полсекунды. Тихие растяжки сохранены. */
  var delay = first ? 3500 : 900 + Math.random() * 1500;
  if (!first && Math.random() < 0.15) delay *= 2.2;
  namePulse.timer = setTimeout(runNamePulse, delay);
}
function runNamePulse() {
  if (document.hidden || motionOff() || namePulse.busy) { scheduleNamePulse(false); return; }
  var letters = document.querySelectorAll(".hero-name-line b");
  if (!letters.length) return;
  var i;
  do { i = (Math.random() * letters.length) | 0; } while (letters.length > 1 && i === namePulse.last);
  namePulse.last = i;
  var node = letters[i], original = node.textContent;
  var frames = 5 + ((Math.random() * 4) | 0), n = 0;
  namePulse.busy = true;
  node.classList.add("is-unresolved");
  var tick = setInterval(function () {
    n++;
    if (n < frames) {
      node.textContent = HINT_GLYPHS[(Math.random() * HINT_GLYPHS.length) | 0];
    } else {
      clearInterval(tick);
      node.textContent = original;
      node.classList.remove("is-unresolved");
      namePulse.busy = false;
      scheduleNamePulse(false);
    }
  }, 72);
}
document.addEventListener("visibilitychange", function () {
  if (document.hidden) { clearTimeout(namePulse.timer); namePulse.timer = null; }
  else if (!namePulse.timer && !namePulse.busy) scheduleNamePulse(false);
});
scheduleNamePulse(true);
/* Ручка для проверок: наборы и живая демонстрация вызывают пульс сами,
   не дожидаясь случайного интервала. Поведение — то же, путь — тот же. */
window.sbNamePulse = runNamePulse;

/* dock auto-hide → «покой». Имя настройки в интерфейсе изменено вместе с
   поведением: она больше не прячет док, а приглушает его. */
var hideTimer = null;
function revealDock() {
  el("dock").classList.remove("is-resting");
}
/* (Re)start the 2.8s hide countdown. With the toggle off the dock just stays
   visible — this must never call showDock(), which arms the timer again. */
function armAutoHide() {
  clearTimeout(hideTimer);
  if (!state.booted) return;
  if (!state.prefs.autohide) { revealDock(); return; }
  hideTimer = setTimeout(function () {
    el("dock").classList.add("is-resting");
  }, 2800);
}
/* Разлёт иконок при открытии двери. Точка происхождения — место касания:
   иконки собираются к слотам из-под пальца, а не из абстрактного ниоткуда.
   Хаос управляем: смещение к точке касания 22–36% дистанции, подъём снизу
   30–64px, поворот до ±13°, порядок посадки перетасован Фишером–Йетсом,
   шаг задержки 26 мс. Всё пересоздаётся на каждом открытии. */
function assembleDock(originX) {
  if (motionOff()) return;
  var dock = el("dock");
  var items = dock.querySelectorAll(".dock-item");
  if (!items.length) return;
  var rect = dock.getBoundingClientRect();
  var ox = (typeof originX === "number") ? originX : rect.left + rect.width / 2;

  /* Режимы раскрытия. Канон v21 — «свет строит» (light): вердикт совета по
     моушн-идентичности, MOTION-IDENTITY-VERDICT.md. Остальные — оснастка
     сравнения вживую, не для посетителей:
       light   — свет разливается от точки касания; ничто не движется (канон)
       develop — проявка: глиняные силуэты обретают резкость и свой цвет
       wave    — перекличка: волна включения от точки касания, по порядку
       both    — прежний полёт с глифами (канон v20.6), flight/glyph — его части */
  var MODES = { light: 1, develop: 1, wave: 1, both: 1, flight: 1, glyph: 1 };
  var mode = assembleDock._mode;
  if (!mode) {
    try { mode = new URLSearchParams(location.search).get("dockmat") || "light"; }
    catch (e) { mode = "light"; }
    if (!MODES[mode]) mode = "light";
    assembleDock._mode = mode;
  }

  clearTimeout(assembleDock._t);
  var cleanupMs = 750;

  if (mode === "light") {
    /* Свет: задержка каждой плитки — её расстояние от точки касания. Скорость
       разлива ~2100 px/с вдоль кромки; дальний край широкого экрана загорается
       через ~0.3 с. Вспышка-блик бежит по шву отдельным слоем. */
    items.forEach(function (n) {
      var r = n.getBoundingClientRect();
      var dist = Math.abs((r.left + r.width / 2) - ox);
      n.style.setProperty("--lit-delay", (dist / 2100).toFixed(3) + "s");
    });
    var flare = document.createElement("i");
    flare.className = "dock-flare";
    flare.setAttribute("aria-hidden", "true");
    flare.style.left = Math.round(ox) + "px";
    document.body.appendChild(flare);
    flare.addEventListener("animationend", function () { flare.remove(); });
    setTimeout(function () { flare.remove(); }, 900);           /* страховка */
    dock.classList.add("m-light");
    cleanupMs = 950;
  } else if (mode === "develop") {
    /* Проявка: у каждой плитки свой темп (0.42–0.87 с) и лёгкий сдвиг старта —
       кювета не метроном. Порядок непредсказуем, результат неизбежен. */
    items.forEach(function (n) {
      n.style.setProperty("--dev-dur", (0.42 + Math.random() * 0.45).toFixed(3) + "s");
      n.style.setProperty("--dev-delay", (Math.random() * 0.12).toFixed(3) + "s");
    });
    dock.classList.add("m-develop");
    cleanupMs = 1150;
  } else if (mode === "wave") {
    /* Перекличка: строгий порядок удаления от точки касания, шаг 42 мс.
       Единственный режим без случайности — причинность и есть его характер. */
    var ranked = [];
    items.forEach(function (n, i) {
      var r = n.getBoundingClientRect();
      ranked.push({ i: i, d: Math.abs((r.left + r.width / 2) - ox) });
    });
    ranked.sort(function (a, b) { return a.d - b.d; });
    ranked.forEach(function (entry, rank) {
      items[entry.i].style.setProperty("--wave-delay", (rank * 0.042).toFixed(3) + "s");
    });
    dock.classList.add("m-wave");
    cleanupMs = 850;
  } else {
    /* Канон v20.6: разлёт из-под пальца + становление глиф→иконка. */
    var order = [];
    items.forEach(function (n, i) { order.push(i); });
    for (var i = order.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    items.forEach(function (n, i) {
      var r = n.getBoundingClientRect();
      var toward = (ox - (r.left + r.width / 2)) * (0.22 + Math.random() * 0.14);
      n.style.setProperty("--fly-x", toward.toFixed(1) + "px");
      n.style.setProperty("--fly-y", (30 + Math.random() * 34).toFixed(1) + "px");
      n.style.setProperty("--fly-r", ((Math.random() - 0.5) * 26).toFixed(1) + "deg");
      n.style.setProperty("--fly-delay", (order.indexOf(i) * 0.026).toFixed(3) + "s");
      if (mode !== "flight") {
        var tile = n.querySelector(".tile");
        var g = tile.querySelector(".mat");
        if (!g) { g = document.createElement("i"); g.className = "mat"; g.setAttribute("aria-hidden", "true"); tile.appendChild(g); }
        g.textContent = HINT_GLYPHS[(Math.random() * HINT_GLYPHS.length) | 0];
      }
    });
    if (mode !== "glyph") dock.classList.add("is-assembling");
    if (mode !== "flight") dock.classList.add("is-materializing");
  }

  assembleDock._t = setTimeout(function () {
    dock.classList.remove("is-assembling");
    dock.classList.remove("is-materializing");
    dock.classList.remove("m-light");
    dock.classList.remove("m-develop");
    dock.classList.remove("m-wave");
  }, cleanupMs);
}
/* v42: щита первого касания больше нет. Он существовал, потому что док
   выезжал из-за кромки под палец и первый тап случайно попадал в взлетевшую
   плитку. Док больше не прячется — гасить первый тап теперь означает просто
   терять клиента, который дотронулся до иконки. */
function showDock(ev) {
  var x;
  if (ev && ev.touches && ev.touches[0]) x = ev.touches[0].clientX;
  else if (ev && typeof ev.clientX === "number") x = ev.clientX;
  if (el("dock").classList.contains("is-resting")) assembleDock(x);
  revealDock();
  armAutoHide();
}

function clearChatBadge() {
  state.chat.unread = false;
  dockItems.chat.classList.remove("has-badge");
}
function setChatBadge() {
  state.chat.unread = true;
  dockItems.chat.classList.add("has-badge");
}

/* -------------------------------------------------------- window manager */

function openApp(app) {
  var win = wins[app];
  if (win) {
    if (win.minimized) restoreWindow(app); else focusWindow(app);
    return;
  }
  createWindow(app);
}

function createWindow(app) {
  var vw = window.innerWidth, vh = window.innerHeight;

  /* A window opens at the size its own content wants — WIN_SIZE is authored
     per app, not one number for all of them — clamped to what the viewport
     can actually hold, and cascaded so a second window does not land exactly
     on the first. Full screen is a thing the visitor asks for with the
     maximise key, not a thing that happens to them on open.

     Below the compact threshold there is no room for a floating window, so it
     opens as a full-bleed sheet under the top bar. The bar is left clear on
     purpose: the window layer is z-index 200 and the top bar 400, so a sheet
     drawn to y:0 would bury its own controls. */
  var authored = WIN_SIZE[app];
  var n = state.openCount++;
  var w, h, x, y, bornMax = false;

  if (vw <= 620) {
    /* НА ТЕЛЕФОНЕ ОКНО РАСКРЫВАЕТСЯ ВО ВЕСЬ ЭКРАН (13.08.2026, решение 022).
       Здесь стояло обратное правило — поля со всех четырёх сторон, «окно
       остаётся окном на любом экране, полный экран просит посетитель». Оно
       красиво звучит и проигрывает на измерении: на 390px поля съедали 32px
       ширины (8%) и отдавали их фону, а содержимое — ползунки, сметы, таблицы —
       и без того упирается в край. Основатель увидел это первым и был прав.
       Правило теперь одно: под 620px окно = лист во весь экран под полосой,
       ровно как в ОС. Полоса остаётся видимой намеренно: слой окон z-index 200,
       полоса 400, и лист, доведённый до y:0, похоронил бы собственные кнопки. */
    w = vw;
    h = vh - TOPBAR_H;
    x = 0;
    y = TOPBAR_H;
  } else {
    w = Math.min(authored[0], vw - 32);
    h = Math.min(authored[1], vh - 170);
    x = clamp(Math.round((vw - w) / 2 + ((n % 5) * 26 - 52)), 16, Math.max(16, vw - w - 16));
    y = clamp(Math.round((vh - h) / 2 + ((n % 5) * 20 - 40)), 54, Math.max(54, vh - h - 116));
  }

  var node = makeEl("div", "win");
  /* The window knows which application it is. Nothing depended on this before,
     which is why it was never recorded — but a surface that cannot say what it
     is showing cannot be checked, and cannot be styled per app later. */
  node.setAttribute("data-app", app);
  setHtml(node,
    '<div class="win-bar">' +
      '<div class="lights">' +
        '<button class="light light-close" aria-label="Close"><span>&times;</span></button>' +
        '<button class="light light-min" aria-label="Minimize"><span>&ndash;</span></button>' +
        '<button class="light light-max" aria-label="Maximize"><span>+</span></button>' +
      "</div>" +
      '<div class="win-title"></div>' +
    "</div>" +
    '<div class="win-body"></div>' +
    '<div class="win-resize"></div>');
  node.style.left = x + "px";
  node.style.top = y + "px";
  node.style.width = w + "px";
  node.style.height = h + "px";
  el("windowLayer").appendChild(node);

  var record = {
    app: app, node: node, body: $(".win-body", node), bar: $(".win-bar", node),
    titleEl: $(".win-title", node), rect: { x: x, y: y, w: w, h: h },
    minimized: false, maximized: bornMax, prevRect: null
  };
  wins[app] = record;
  record.titleEl.textContent = appCopy(app).title;
  renderWindow(app);
  reserveDockRoom(record);
  wireWindow(record);
  focusWindow(app);
  genieIn(record);
  refreshDockState();
}

function dockCenter(app) {
  var rect = dockItems[app].getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

function genieIn(record) {
  if (osReducedMotion()) return;
  var target = dockCenter(record.app);
  var cx = record.rect.x + record.rect.w / 2, cy = record.rect.y + record.rect.h / 2;
  record.node.style.transformOrigin = "center center";
  record.node.style.transform = "translate(" + (target.x - cx) + "px," + (target.y - cy) + "px) scale(.12)";
  record.node.style.opacity = "0";
  requestAnimationFrame(function () {
    record.node.classList.add("is-animating");
    record.node.style.transform = "none";
    record.node.style.opacity = "1";
    setTimeout(function () { record.node.classList.remove("is-animating"); }, 500);
  });
}

function genieOut(record, done) {
  if (osReducedMotion()) { done(); return; }
  var target = dockCenter(record.app);
  var cx = record.rect.x + record.rect.w / 2, cy = record.rect.y + record.rect.h / 2;
  record.node.classList.add("is-animating");
  record.node.style.transform = "translate(" + (target.x - cx) + "px," + (target.y - cy) + "px) scale(.12)";
  record.node.style.opacity = "0";
  setTimeout(done, 400);
}

function focusWindow(app) {
  var record = wins[app];
  if (!record) return;
  state.focused = app;
  record.node.style.zIndex = String(++state.zTop);
  Object.keys(wins).forEach(function (id) {
    wins[id].node.classList.toggle("is-focused", id === app);
  });
  refreshDockState();
  updateAppName();
}

function blurWindows() {
  state.focused = null;
  Object.keys(wins).forEach(function (id) { wins[id].node.classList.remove("is-focused"); });
  refreshDockState();
  updateAppName();
}

function focusTopmost() {
  var best = null, bestZ = -1;
  Object.keys(wins).forEach(function (id) {
    if (wins[id].minimized) return;
    var z = parseInt(wins[id].node.style.zIndex || "0", 10);
    if (z > bestZ) { bestZ = z; best = id; }
  });
  if (best) focusWindow(best); else blurWindows();
}

function closeWindow(app) {
  var record = wins[app];
  if (!record) return;
  genieOut(record, function () {
    record.node.remove();
    delete wins[app];
    if (state.focused === app) state.focused = null;
    focusTopmost();
    refreshDockState();
  });
}

function minimizeWindow(app) {
  var record = wins[app];
  if (!record || record.minimized) return;
  genieOut(record, function () {
    record.minimized = true;
    record.node.style.display = "none";
    if (state.focused === app) state.focused = null;
    focusTopmost();
    refreshDockState();
  });
}

function restoreWindow(app) {
  var record = wins[app];
  if (!record) return;
  record.minimized = false;
  record.node.style.display = "";
  record.node.style.transform = "none";
  record.node.style.opacity = "1";
  genieIn(record);
  focusWindow(app);
  refreshDockState();
}

function applyRect(record, rect, animate) {
  record.rect = rect;
  if (animate && !osReducedMotion()) {
    record.node.classList.add("is-animating");
    setTimeout(function () { record.node.classList.remove("is-animating"); }, 420);
    /* Пересчёт ПОСЛЕ переезда. Во время анимации rect окна — промежуточный,
       и запас, посчитанный тогда, меньше настоящего: максимизация давала
       окно во весь экран и запас от прежней, маленькой рамки. Красный по
       «Окупаемости» на десктопе — ровно этот случай. */
    setTimeout(function () { reserveDockRoom(record); }, 480);
  }
  record.node.style.left = rect.x + "px";
  record.node.style.top = rect.y + "px";
  record.node.style.width = rect.w + "px";
  record.node.style.height = rect.h + "px";
  reserveDockRoom(record);
}

/* ЗАПАС ПОД ДОКОМ — измерением, а не памятью.
   Основатель прислал живой телефон: кнопка внизу окна закрыта доком, и так
   во всех окнах. Причина — не небрежность вёрстки, а след правильного
   решения. Пока док уезжал за кромку через 2.8 c, всё закрытое им
   освобождалось само, и код это учитывал. В v42 док перестал уходить — он
   затихает, но остаётся, — и перекрытие стало постоянным. Посылка отменена,
   вывод продолжал работать: классическая мина.
   Правило теперь одно: окно, дно которого заходит в зону дока, отдаёт
   прокрутке ровно ту высоту, которую док закрывает. Ни пикселем больше:
   окно, стоящее сбоку от дока (десктоп) или выше него, не платит ничего.
   Зона считается от ПРИПАРКОВАННОГО положения — offsetHeight и значение
   bottom, а не rect: у дока живут покой, уход и подпрыгивание, и мерить
   его сдвинутым — значит отдавать содержимому то больше, то меньше места
   на каждой анимации. Ту же величину ОС публикует как --dock-h: одна
   механика на две поверхности. */
function reserveDockRoom(record) {
  if (!record || !record.body) return;
  var dock = el("dock");
  if (!dock) return;
  var cs = getComputedStyle(dock);
  var parkedH = dock.offsetHeight + (parseFloat(cs.bottom) || 0);
  var zoneTop = window.innerHeight - parkedH;
  var wr = record.node.getBoundingClientRect();
  var dr = dock.getBoundingClientRect();
  var meets = Math.min(wr.right, dr.right) - Math.max(wr.left, dr.left) > 0;
  var deep = wr.bottom - zoneTop;
  record.body.style.setProperty("--dock-room",
    (meets && deep > 0 ? Math.ceil(deep) + 12 : 0) + "px");
}
function reserveDockRoomAll() {
  for (var app in wins) if (wins[app]) reserveDockRoom(wins[app]);
}
window.sbReserveDockRoom = reserveDockRoomAll;   /* ручка для приборов */

function toggleMaximize(app) {
  var record = wins[app];
  if (!record) return;
  if (record.maximized) {
    applyRect(record, record.prevRect, true);
    record.maximized = false;
  } else {
    record.prevRect = { x: record.rect.x, y: record.rect.y, w: record.rect.w, h: record.rect.h };
    /* Окно занимает экран целиком, док плывёт поверх (z 300 > z окна) — и
       это правильно: резервировать пустую полосу в 150px под уходящий док
       было хуже. ОГОВОРКА v44: с тех пор док уходить перестал (он затихает),
       и место под ним теперь отдаёт не рамка окна, а прокрутка содержимого —
       ровно на высоту перекрытия, см. reserveDockRoom(). */
    applyRect(record, { x: 12, y: 52, w: window.innerWidth - 24, h: window.innerHeight - 64 }, true);
    record.maximized = true;
  }
}

function wireWindow(record) {
  var app = record.app;
  record.node.addEventListener("pointerdown", function () { focusWindow(app); });
  $(".light-close", record.node).addEventListener("click", function (e) { e.stopPropagation(); closeWindow(app); });
  $(".light-min", record.node).addEventListener("click", function (e) { e.stopPropagation(); minimizeWindow(app); });
  $(".light-max", record.node).addEventListener("click", function (e) { e.stopPropagation(); toggleMaximize(app); });
  record.bar.addEventListener("dblclick", function () { toggleMaximize(app); });

  /* drag with edge-snap preview */
  record.bar.addEventListener("pointerdown", function (ev) {
    if (ev.target.closest(".lights")) return;
    if (record.maximized) return;
    var startX = ev.clientX, startY = ev.clientY;
    var originX = record.rect.x, originY = record.rect.y;
    var snapSide = null;
    var preview = el("snapPreview");
    record.bar.setPointerCapture(ev.pointerId);

    function move(e) {
      var vw = window.innerWidth, vh = window.innerHeight;
      var nx = clamp(originX + (e.clientX - startX), -(record.rect.w - 160), vw - 160);
      var ny = clamp(originY + (e.clientY - startY), 50, vh - 40);
      applyRect(record, { x: nx, y: ny, w: record.rect.w, h: record.rect.h }, false);
      snapSide = e.clientX <= 24 ? "left" : (e.clientX >= vw - 24 ? "right" : null);
      if (snapSide) {
        var r = snapRect(snapSide);
        preview.style.left = r.x + "px";
        preview.style.top = r.y + "px";
        preview.style.width = r.w + "px";
        preview.style.height = r.h + "px";
        preview.classList.add("is-shown");
      } else {
        preview.classList.remove("is-shown");
      }
    }
    function up() {
      record.bar.removeEventListener("pointermove", move);
      record.bar.removeEventListener("pointerup", up);
      preview.classList.remove("is-shown");
      if (snapSide) {
        record.prevRect = { x: originX, y: originY, w: record.rect.w, h: record.rect.h };
        applyRect(record, snapRect(snapSide), true);
        record.maximized = true;     /* a snap restores like a maximize */
      }
    }
    record.bar.addEventListener("pointermove", move);
    record.bar.addEventListener("pointerup", up);
  });

  /* resize */
  $(".win-resize", record.node).addEventListener("pointerdown", function (ev) {
    if (record.maximized) return;
    ev.stopPropagation();
    var handle = ev.currentTarget;
    var startX = ev.clientX, startY = ev.clientY;
    var w0 = record.rect.w, h0 = record.rect.h;
    handle.setPointerCapture(ev.pointerId);
    function move(e) {
      var w = clamp(w0 + (e.clientX - startX), 380, window.innerWidth - 40);
      var h = clamp(h0 + (e.clientY - startY), 320, window.innerHeight - 90);
      applyRect(record, { x: record.rect.x, y: record.rect.y, w: w, h: h }, false);
    }
    function up() {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
    }
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  });
}

function snapRect(side) {
  var vw = window.innerWidth, vh = window.innerHeight;
  var w = Math.round((vw - 32) / 2) - 6;
  return { x: side === "left" ? 16 : vw - 16 - w, y: 52, w: w, h: vh - 150 };
}

/* ---------------------------------------------------------------- panels */

function renderWindow(app) {
  var record = wins[app];
  if (!record) return;
  record.body.scrollTop = 0;
  if (app === "order") { renderOrder(record); return; }
  if (app === "roi") { renderRoi(record); return; }
  if (app === "chat") { renderChat(record); return; }
  if (app === "cases") { renderCases(record); return; }
  if (app === "product") { renderProduct(record); return; }
  renderSimple(record, app);
}

/* ------------------------------------------------------- introductions §3
   WHY THIS IS QUIET AND WHY IT IS HERE

   This is the one part of the site that could most easily turn into the thing
   the project is against. A scheme of that kind announces itself: a banner, a
   percentage, a call to action, a promise sized to be shared. So this does the
   opposite of all four. It has no banner, states no percentage, is not a call
   to action, and lives at the bottom of the page about who we are — where
   someone who already read that far will find it, and nobody else will be
   interrupted by it.

   The sentence that carries it is not a pitch, it is a fact about how the
   studio works: no attention here was bought. Everything after that follows
   from it, which is why the reward is real but unpriced — a number on a public
   page would be a promise made to a stranger, and the honest version is a
   conversation held before the work starts. */
function introCode() {
  try { return window.localStorage.getItem("sysbaby.intro") || ""; }
  catch (err) { return ""; }
}
function setIntroCode(v) {
  try { window.localStorage.setItem("sysbaby.intro", v); } catch (err) { }
}

/* The link a person can actually send. It carries whatever they call
   themselves — no account, no generated token, nothing to look up — because a
   code only sys.baby can read would mean sys.baby is keeping a register of
   people who have not agreed to be in one. */
function introLink(who) {
  var base = location.origin + location.pathname.replace(/index\.php$/, "");
  return base + "?i=" + encodeURIComponent(String(who || "").trim().slice(0, 80));
}

function attentionHtml() {
  var a = C.attention[state.lang] || C.attention.en;
  return '<section class="attn">' +
    '<h4 class="attn-head">' + esc(a.heading) + "</h4>" +
    '<p class="attn-body">' + esc(a.body) + "</p>" +
    '<button type="button" class="attn-act" id="attnAct">' + esc(a.action) + "</button>" +
    '<div class="attn-tool" id="attnTool" hidden>' +
      '<label class="attn-label" for="attnWho">' + esc(a.who) + "</label>" +
      '<div class="attn-row">' +
        '<input id="attnWho" class="attn-input" type="text" maxlength="80" autocomplete="name" ' +
          'placeholder="' + esc(a.whoPlaceholder) + '">' +
        '<button type="button" class="attn-copy" id="attnCopy">' + esc(a.copy) + "</button>" +
      "</div>" +
      '<p class="attn-link" id="attnOut" aria-live="polite"></p>' +
      '<p class="attn-fine">' + esc(a.fine) + "</p>" +
    "</div>" +
  "</section>";
}

function wireAttention(root) {
  var act = $("#attnAct", root), tool = $("#attnTool", root);
  if (!act || !tool) return;
  /* NOT named `copy`: that identifier is reserved by convention in this file
     for a localized copy object, and the content checker reads it as one. */
  var who = $("#attnWho", tool), out = $("#attnOut", tool), copyBtn = $("#attnCopy", tool);
  var a = C.attention[state.lang] || C.attention.en;

  act.addEventListener("click", function () {
    var open = !tool.hasAttribute("hidden");
    if (open) { tool.setAttribute("hidden", ""); return; }
    tool.removeAttribute("hidden");
    try { who.focus(); } catch (err) { }
  });

  function render() {
    var v = who.value.trim();
    out.textContent = v ? introLink(v) : "";
  }
  who.addEventListener("input", render);

  copyBtn.addEventListener("click", function () {
    var v = who.value.trim();
    if (!v) { try { who.focus(); } catch (err) { } return; }
    var url = introLink(v);
    out.textContent = url;
    var done = function () { copyBtn.textContent = a.copied; setTimeout(function () { copyBtn.textContent = a.copy; }, 2200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { done(); });
    } else { done(); }
  });
}

/* ------------------------------------------------------------- SYS CARE
   WHAT THIS IS AND WHAT IT MUST NOT BECOME

   It answers one question and only that one: what happens after the system is
   built. It sits at the very END of the order window, after the ownership
   note and after the steps, because it is the last thing that matters — not
   the first. If it ever moves higher, or grows a comparison grid, the page
   stops being a systems studio and starts being a hosting company.

   The paragraph directly above it says "no subscription to lapse", and that
   sentence must survive this one. So the framing is deliberate: the system
   runs whether we are involved or not, and this is about keeping it running
   WELL. Care is not what keeps it alive; ownership already did that.

   Prices are "from", with no table and no comparison, because the real number
   depends on the system and inventing a fixed one would be the first
   unsupported promise on the page. There are no response times and no uptime
   percentages anywhere in this copy — we have not established any, so we do
   not print any. */
function careHtml() {
  var c = C.care[state.lang] || C.care.en;
  function level(name, from, body) {
    return '<div class="care-level">' +
      '<div class="care-head">' +
        '<span class="care-name">' + esc(name) + "</span>" +
        '<span class="care-from">' + esc(from) + "</span>" +
      "</div>" +
      '<p class="care-body">' + esc(body) + "</p>" +
    "</div>";
  }
  return '<section class="care">' +
    '<h4 class="care-title">' + esc(c.title) + "</h4>" +
    '<p class="care-lead">' + esc(c.lead) + "</p>" +
    level(c.careName, c.careFrom, c.careBody) +
    level(c.proName, c.proFrom, c.proBody) +
    '<p class="care-foot">' + esc(c.foot) + "</p>" +
  "</section>";
}

/* Живые часы Таллинна в контактах.
   Смысл не в украшении: страница заявляет «система не закрывается никогда»,
   и тут же честно показывает, работает ли сейчас ЧЕЛОВЕК. Состояние и время
   считаются из одного источника — staticStrings.supportHours, — потому что
   два источника разошлись бы в первый же переход на летнее время.
   Часовой пояс берётся у Intl, а не арифметикой от UTC: DST — не наша забота.
   Охраняется tools/support-hours-check.mjs. */
function tallinnNow() {
  var conf = S.supportHours, zone = (conf && conf.zone) || "Europe/Tallinn";
  var parts;
  try {
    parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: zone, weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(new Date());
  } catch (e) { return null; }          /* нет Intl — строки просто не будет */
  var got = {};
  parts.forEach(function (p) { got[p.type] = p.value; });
  var days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  var h = parseInt(got.hour, 10), m = parseInt(got.minute, 10);
  if (h === 24) h = 0;                  /* некоторые движки отдают 24:00 */
  return { day: days[got.weekday], mins: h * 60 + m,
           text: (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m };
}
function supportIsOpen(now) {
  var conf = S.supportHours;
  if (!conf || !conf.spans || !now) return null;
  for (var i = 0; i < conf.spans.length; i++) {
    var s = conf.spans[i];
    if (s.d.indexOf(now.day) !== -1 && now.mins >= s.f && now.mins < s.t) return true;
  }
  return false;
}
var hoursTimer = null;
function paintHoursClock() {
  var node = el("hoursNow");
  if (!node) { clearInterval(hoursTimer); hoursTimer = null; return; }
  var copy = appCopy("contact");
  var now = tallinnNow();
  if (!now || !copy.hours || !copy.hours.now) { node.textContent = ""; return; }
  var open = supportIsOpen(now);
  var tail = open === null ? "" : " · " + (open ? copy.hours.open : copy.hours.closed);
  node.textContent = copy.hours.now.replace("{TIME}", now.text) + tail;
  node.className = "hours-now" + (open ? " is-open" : "");
}
function startHoursClock() {
  clearInterval(hoursTimer);
  paintHoursClock();
  hoursTimer = setInterval(paintHoursClock, 20000);
}

function renderSimple(record, app) {
  var copy = appCopy(app);
  var html = "<h3>" + copy.title + "</h3>";
  /* РАСШИФРОВКА ИМЕНИ (D-049). Стоит только в окне «О нас» — там, где человек
     и спрашивает, что значит это имя. Не переводится намеренно: расшифровка
     объясняет английское имя, ровно как строка BABY на первом экране, и
     перевод разрушил бы соответствие. Источник строки один — спецификация
     (staticStrings.nameDecoding), второй копии в коде нет. */
  if (app === "about" && S.nameDecoding) {
    html += '<p class="name-decoding">sys.baby — <b>' + esc(S.nameDecoding) + "</b></p>";
  }
  html += "<p>" + copy.intro + "</p>";
  if (copy.items && copy.items.length) {
    html += '<ul class="panel-list">' + copy.items.map(function (item) {
      return "<li>" + item + "</li>";
    }).join("") + "</ul>";
  }
  /* Часы живой поддержки. Заявление и расписание стоят рядом намеренно:
     система работает всегда, человек — по часам, и разница названа вслух,
     а не спрятана. Блок рисуется только если он есть в контенте. */
  if (copy.hours && copy.hours.line) {
    html += '<div class="panel-hours"><b>' + esc(copy.hours.line) + "</b>" +
      "<span>" + esc(copy.hours.note) + "</span>" +
      '<i class="hours-now" id="hoursNow"></i></div>';
  }
  /* Only under About: it is a statement about how the studio works, so it
     belongs with the rest of that, not floating on its own. */
  if (app === "about") html += attentionHtml();
  setHtml(record.body, html);
  if (app === "about") wireAttention(record.body);
  if (copy.hours && copy.hours.line) startHoursClock();
}

/* Cases: generated from the portfolio safe views (spec §11). */
function caseItemHtml(view, lang) {
  var labels = C.portfolioCaseLabels[lang] || C.portfolioCaseLabels.en;
  var parts = [];
  parts.push('<span class="case-goal">' + esc(view.goal) + "</span>");
  var meta = [view.industry, view.projectType].filter(Boolean).map(esc).join(" &middot; ");
  if (meta) parts.push('<span class="case-meta">' + meta + "</span>");
  if (view.features && view.features.length) {
    parts.push('<span class="case-meta">' + esc(labels.built) + ": " +
      view.features.map(esc).join(" &middot; ") + "</span>");
  }
  if (view.scale) parts.push('<span class="case-meta">' + esc(view.scale) + "</span>");
  if (view.resultsState === "measured" && view.results) {
    parts.push('<span class="case-result">' + esc(view.results) + "</span>" +
      '<span class="case-note">' + esc(labels.reported) + "</span>");
  }
  if (view.origin) parts.push('<span class="case-note">' + esc(view.origin.label) + "</span>");
  /* Собственная разработка: стороннего заказчика нет, и это сказано прямо.
     Раньше такая запись попадала в ветку «имя скрыто по просьбе клиента» —
     то есть страница называла причину, которой не было. */
  if (view.nameState === "own-build") parts.push('<span class="case-note">' + esc(labels.ownBuild) + "</span>");
  else if (view.nameState === "withheld") parts.push('<span class="case-note">' + esc(labels.withheld) + "</span>");
  else if (view.nameState === "not-yet-asked") parts.push('<span class="case-note">' + esc(labels.notasked) + "</span>");
  return "<li>" + parts.join("<br>") + "</li>";
}

/* ═══════════════════════════════════════════════════════════════════════════
   ПЕРВЫЙ ПРОДУКТ · окно «Смета» — вход в систему, а не рассказ о системе
   ───────────────────────────────────────────────────────────────────────────
   ПОВОД. До этого окна путь человека выглядел так: посмотрел страницу →
   прочитал о кейсах → может быть нажал «живая система» внутри карточки →
   попал в чужую вкладку. Четыре шага до первого действия и ни одного
   наблюдаемого события по дороге. Решение союза (D-046-ONE-ENTRANCE): один
   вход, и первым в доке стоит рабочая вещь.

   ЧТО ЗДЕСЬ ЕСТЬ.
   1. Рамка с НАСТОЯЩЕЙ системой клиента (тот же адрес, что открывает
      портфолио, — адрес берётся у общего источника sbResolveCasePath).
   2. Граница, а не гарантия (класс D в терминах внутреннего контура):
      сказано ровно то, что верно, — введённое остаётся в браузере и у нас
      не хранится. Это ограничение витрины, и оно названо там же, где
      предлагается пробовать.
   3. ЗАПИСЬ СПРОСА. Открытие окна и нажатие «рассказать» кладутся в местный
      журнал (sysbaby.demand.log) и предлагают человеку сказать одной
      строкой — через тот же чат, который уже доходит письмом. Это
      единственное место в проекте, где спрос вообще может появиться:
      всё остальное измеряет нас, а не людей.
   Охраняется tools/first-product-check.mjs. */
function demandNote(kind, extra) {
  try {
    var raw = localStorage.getItem("sysbaby.demand.log");
    var log = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(log)) log = [];
    log.push({ k: kind, t: Date.now(), lang: state.lang, x: extra || null });
    /* Журнал местный и короткий: он подсказка человеку, а не слежка. */
    localStorage.setItem("sysbaby.demand.log", JSON.stringify(log.slice(-40)));
    return log.length;
  } catch (e) { return 0; }
}
window.sbDemandLog = function () {
  try { return JSON.parse(localStorage.getItem("sysbaby.demand.log") || "[]"); }
  catch (e) { return []; }
};

function renderProduct(record) {
  var lang = state.lang;
  var t = appCopy("product", lang);
  /* Адрес берётся у единственного источника — записи портфолио, а не пишется
     здесь второй раз: вторая копия правды расходится молча. Путь в источнике
     записан от корня ОС («../cases/…»), потому что первым его потребителем
     было приложение портфолио внутри os/. Лендинг лежит на этаж выше, и
     ведущие «../» ему лишние — снимаем их ЗДЕСЬ, у потребителя, оставив
     источник нетронутым. Внешний адрес (SB_CASES_BASE) проходит как есть. */
  var entry = null;
  if (window.sbPortfolio) {
    for (var i = 0; i < window.sbPortfolio.length; i++) {
      var v = window.sbPortfolioView(window.sbPortfolio[i], lang);
      if (v && v.explorePath) { entry = v; break; }
    }
  }
  var url = entry ? entry.explorePath : "cases/auto-estimate/index.html";
  if (!/^https?:\/\//.test(url)) url = url.replace(/^(\.\.\/)+/, "");
  setHtml(record.body,
    '<h3>' + esc(t.title) + "</h3>" +
    "<p>" + esc(t.intro) + "</p>" +
    '<div class="product-frame"><iframe id="productFrame" src="' + esc(url) + '" ' +
      'title="' + esc(t.title) + '" loading="lazy"></iframe></div>' +
    /* Граница и призыв живут В ОДНОМ липком блоке. Сначала они стояли врозь:
       граница — в потоке, кнопка — липкая, и кнопка накрыла границу собой.
       Система, показывающая предложение поверх собственного предела, врёт
       оформлением, даже когда текст верен. Поэтому вместе и всегда видны. */
    '<div class="product-ask">' +
      '<p class="product-note"><span class="d-mark">D</span>' + esc(t.note) + "</p>" +
      "<b>" + esc(t.askIntro) + "</b>" +
      '<button class="btn btn-primary" type="button" id="productAsk">' + esc(t.ask) + "</button>" +
    "</div>");
  demandNote("product:open");
  var ask = $("#productAsk", record.body);
  if (ask) {
    ask.addEventListener("click", function () {
      demandNote("product:tell");
      openApp("chat");
      /* Заготовка текста — не сообщение за человека: строка обрывается на
         полуслове намеренно, дописывает он. Пустое поле после нажатия — это
         дефект, и его ловит закон. */
      setTimeout(function () {
        var box = document.querySelector("#chatText");
        if (box && !box.value) {
          box.value = t.prefill;
          box.focus();
          try { box.setSelectionRange(box.value.length, box.value.length); } catch (e) { /* не критично */ }
        }
      }, 260);
    });
  }
}

/* ── «ИЗБРАННЫЕ ПРОЕКТЫ» РИСУЕТ ТОТ ЖЕ МОДУЛЬ, ЧТО И ПОРТФОЛИО (v47.1) ────
 *
 * Основатель: «в раздел selected work на лендинге нужно уместить информацию
 * из приложения портфолио, так как оно не должно быть в OS, портфолио должно
 * быть в приложении build». Совет проголосовал за общий модуль отрисовки:
 * shared/portfolio.view.js рисует и окно системы, и этот раздел.
 *
 * Здесь остаётся ровно то, что принадлежит витрине: заголовок раздела, её
 * собственное вступление о конфиденциальности и ссылка в систему. Всё
 * остальное — карточки, живые предпросмотры, очередь работ, призыв — идёт
 * из общего модуля, и второй копии этой вёрстки на витрине больше нет.
 *
 * Список ниже сохранён как ЗАПАСНОЙ ХОД: если общий модуль не загрузился,
 * раздел показывает работы простым списком, а не пустоту. Молчаливой дыры
 * на месте главного раздела быть не должно.
 */
function renderCases(record) {
  var lang = state.lang;
  var copy = appCopy("cases", lang);
  var platformLabel = C.casesOpenPlatformLabel[lang] || C.casesOpenPlatformLabel.en;

  if (typeof window.sbRenderPortfolioInto === "function") {
    setHtml(record.body,
      "<h3>" + copy.title + "</h3><p>" + copy.intro + "</p>" +
      '<div class="pf-mount"></div>' +
      '<p class="link-row"><a href="' + esc(OS_LINK) + '">' + esc(platformLabel) + "</a></p>");
    var mount = record.body.querySelector(".pf-mount");
    var drawn = false;
    try { drawn = window.sbRenderPortfolioInto(mount, "build", lang); }
    catch (err) { console.error("[cases] shared portfolio failed", err); drawn = false; }
    if (drawn) return;
    /* не получилось — падаем в запасной список ниже, а не оставляем дыру */
  }

  var items = [];
  if (window.sbPortfolio && window.sbPortfolioView) {
    window.sbPortfolio.forEach(function (entry) {
      if (!entry || entry.visibility === "private") return;   /* never surfaced */
      items.push(caseItemHtml(window.sbPortfolioView(entry, lang), lang));
    });
  }
  /* Work that is real but has nothing to open yet. Reads the same object the
     OS Portfolio does, so the count cannot be current in one place and stale
     in the other — and it keeps the register of the entries above it: a
     number and a state, no client and no promise of a date. */
  if (typeof window.sbPipelineView === "function") {
    var pipe = window.sbPipelineView(lang);
    if (pipe) {
      (pipe.rows || [pipe]).forEach(function (r) {
        items.push('<li class="plain case-pipeline">' +
          '<span class="case-pipe-count">' + esc(r.count) + "</span>" +
          '<span class="case-pipe-label">' + esc(r.label) + "</span><br>" +
          '<span class="case-note">' + esc(r.note) + "</span></li>");
      });
    }
  }
  items.push('<li class="plain">' + (C.portfolioCaseLink[lang] || C.portfolioCaseLink.en) + "</li>");
  setHtml(record.body,
    "<h3>" + copy.title + "</h3><p>" + copy.intro + "</p>" +
    '<ul class="panel-list">' + items.join("") + "</ul>" +
    '<p class="link-row"><a href="' + esc(OS_LINK) + '">' + esc(platformLabel) + "</a></p>");
}

/* ----------------------------------------------------------- order panel */

function packageById(lang, id) {
  var packages = appCopy("order", lang).packages;
  for (var i = 0; i < packages.length; i++) if (packages[i].id === id) return packages[i];
  return packages[0];
}

function packageLabel(lang, id) {
  var pkg = packageById(lang, id);
  if (!PRICING) return pkg.name;
  return pkg.name + " — " + PRICING.priceOf(pkg.priceId, lang);
}

/* localStorage read (the landing writes nothing) — spec §17. */
function seenSystemsPrefill(lang) {
  if (!window.sbPortfolio || !window.sbPortfolioView) return "";
  var raw;
  /* Both catches are deliberate no-prefill paths, not swallowed failures: this
     is optional context written by another surface. Storage blocked (private
     mode / disabled cookies) or a corrupt value must leave the visitor with a
     working, empty textarea and nothing to read (spec 17). */
  try { raw = window.localStorage.getItem(SEEN_KEY); } catch (err) { return ""; }
  if (!raw) return "";
  var ids;
  try { ids = JSON.parse(raw); } catch (err) { return ""; }
  if (!Array.isArray(ids)) return "";
  var names = [];
  ids.forEach(function (id) {
    for (var i = 0; i < window.sbPortfolio.length; i++) {
      if (window.sbPortfolio[i].id === id) {
        var view = window.sbPortfolioView(window.sbPortfolio[i], state.lang);
        if (view.name) names.push(view.name);
        return;
      }
    }
  });
  if (!names.length) return "";
  var template = C.seenSystemsLineTemplates[lang] || C.seenSystemsLineTemplates.en;
  return template.replace("{names}", names.join(", ")) + "\n\n";
}

      '<span class="pkg-period">/ ' + pkg.period + "</span></div>" +

    /* No novalidate: name/email are enforced by the browser before the submit
       event fires (spec 12.2 / 19). submitOrder re-checks as a belt and braces. */
    '<form class="order-form" id="orderForm" autocomplete="off">' +
      '<div class="field"><label for="of-name">' + form.name + '</label>' +
        '<input id="of-name" name="name" type="text" required placeholder="' + esc(form.namePh) + '"></div>' +
      '<div class="field"><label for="of-email">' + form.email + '</label>' +
        '<input id="of-email" name="email" type="email" required placeholder="' + esc(form.emailPh) + '"></div>' +
      '<div class="field"><label for="of-phone">' + form.phone + '</label>' +
        '<input id="of-phone" name="phone" type="tel" placeholder="' + esc(form.phonePh) + '"></div>' +
      '<div class="field"><label for="of-package">' + form.selected + '</label>' +
        '<input id="of-package" name="package" type="text" readonly value="' + esc(packageLabel(lang, state.order.pkg)) + '"></div>' +
      '<div class="field"><label for="of-message">' + form.task + '</label>' +
        '<textarea id="of-message" name="message" rows="3" placeholder="' + esc(form.taskPh) + '"></textarea>' +
        '<span class="help">' + form.taskHelp + "</span></div>" +
      '<div class="submit-row">' +
        '<button class="btn-submit" type="submit">' + form.submit + "</button>" +
        '<span class="hint">' + form.hint + "</span>" +
      "</div>" +
      '<div class="form-status" id="orderStatus" role="status" aria-live="polite"></div>' +
    "</form>");

  Array.prototype.forEach.call(record.body.querySelectorAll(".pkg"), function (card) {

        other.classList.toggle("is-selected", other === card);
      });
      $("#of-package", record.body).value = packageLabel(state.lang, state.order.pkg);
    });

  var messageField = $("#of-message", record.body);
  if (!messageField.value) messageField.value = seenSystemsPrefill(lang);
  $("#orderForm", record.body).addEventListener("submit", function (ev) {
    ev.preventDefault();
    submitOrder(record);
  });
}

/* Shared acceptance rule for both formsubmit.co calls (spec §12.3):
   delivered only if the response is OK and the body does not say success:false. */
function acceptResponse(response, bodyText) {
  if (!response.ok) return false;
  if (!bodyText) return true;
  var data;
  try { data = JSON.parse(bodyText); } catch (err) { return true; }
  if (data && (data.success === false || data.success === "false")) return false;
  return true;
}

function fieldValue(form, name) {
  var node = form.elements.namedItem(name);
  return node ? node.value : "";
}

/* The rescue mail body. The blank separator line is itself removed by the
   empty-filter (spec 12.5) — reproduce the filter, not an imagined layout. */
function briefBody(form, lang) {
  var f = appCopy("order", lang).form;
  return [
    f.task + ":",
    fieldValue(form, "message"),
    "",
    "—",
    fieldValue(form, "name"),
    fieldValue(form, "email"),
    fieldValue(form, "phone"),
    fieldValue(form, "package")
  ].filter(Boolean).join("\n");
}

function submitOrder(record) {
  var lang = state.lang;
  var f = appCopy("order", lang).form;
  var form = $("#orderForm", record.body);
  var status = $("#orderStatus", record.body);
  var button = $(".btn-submit", record.body);
  if (!form.checkValidity()) { form.reportValidity(); return; }

  var submittedEmail = fieldValue(form, "email");
  var submittedPackage = fieldValue(form, "package");

  status.className = "form-status";
  setHtml(status, '<span class="line dim">' + f.sending + "</span>");
  button.disabled = true;

  var payload = new FormData(form);
  payload.append("_subject", S.form.orderSubjectTemplate.replace("{packageLabel}", submittedPackage));
  payload.append("_template", "table");
  payload.append("_captcha", "false");
  /* If this visitor arrived through someone's introduction, it rides along
     here and nowhere else. This is the only moment the introduction leaves
     the browser — a person has chosen to write to us, so there is finally
     something to attribute. Until then it sits in local storage doing
     nothing, which is the whole point. */
  var introducedBy = introCode();
  if (introducedBy) payload.append("Introduced by", introducedBy);

  fetch(ENDPOINT, { method: "POST", body: payload, headers: { Accept: "application/json" } })
    .then(function (response) {
      return response.text().then(function (text) { return acceptResponse(response, text); });
    })
    .catch(function () { return false; })
    .then(function (delivered) {
      button.disabled = false;
      if (delivered) orderSuccess(record, f, submittedEmail, submittedPackage);
      else orderFailure(record, f, lang);
    });
}

/* --------------------------------------------------------- roi / payback */

/* SB_ROI:BEGIN — pure payback math + string composition.
   Extracted verbatim and executed by tools/landing-verify-roi.js against the
   acceptance vectors in landing.md §12.7. Depends only on C and PRICING. */
function intFmt(v) {
  return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function monthsFmt(v) {
  if (v < 1) return "<1";
  if (v < 2) return String(Math.round(v * 10) / 10);
  return String(Math.round(v));
}

function rangeFmt(lo, hi, f) {
  var a = f(lo), b = f(hi);
  return a === b ? a : a + "–" + b;
}

function euroRound100(v) { return Math.round(v / 100) * 100; }
function euroFmt(v) { return "€" + intFmt(v); }

function roiCompute(hours, people, rate) {
  var teamWeekly = hours * people;
  var monthLo = teamWeekly * PRICING.SHARE_LO * PRICING.WEEKS / 12;
  var monthHi = teamWeekly * PRICING.SHARE_HI * PRICING.WEEKS / 12;
  var yearLo = teamWeekly * PRICING.SHARE_LO * PRICING.WEEKS * rate;
  var yearHi = teamWeekly * PRICING.SHARE_HI * PRICING.WEEKS * rate;
  var payLo = PRICING.PRICE_LO / (yearHi / 12);
  var payHi = PRICING.PRICE_HI / (yearLo / 12);
  return {
    teamWeekly: teamWeekly, monthLo: monthLo, monthHi: monthHi,
    yearLo: yearLo, yearHi: yearHi, payLo: payLo, payHi: payHi,
    tooSmall: !isFinite(payHi) || payHi > PRICING.MAX_PAYBACK
  };
}

function roiStrings(hours, people, rate, lang) {
  var t = C.appData.roi[lang];
  var c = roiCompute(hours, people, rate);
  var monthUnit = c.payHi < 2 ? t.monthUnit : t.monthsUnit;
  var backText = rangeFmt(c.monthLo, c.monthHi, intFmt) + " " + t.hoursUnit;
  var payText = rangeFmt(c.payLo, c.payHi, monthsFmt) + " " + monthUnit;
  var line1 = t.briefTeam
    .replace("{people}", String(people))
    .replace("{hours}", String(hours))
    .replace("{rate}", String(rate));
  var line2 = c.tooSmall ? t.briefSmall
    : t.briefPay.replace("{back}", backText).replace("{pay}", payText);
  return {
    raw: c,
    tooSmall: c.tooSmall,
    hoursOut: String(hours) + t.hoursUnit,
    peopleOut: String(people),
    rateOut: "€" + String(rate),
    timeFigure: rangeFmt(c.monthLo, c.monthHi, intFmt),
    timeUnit: " " + t.hoursUnit,
    valueFigure: rangeFmt(euroRound100(c.yearLo), euroRound100(c.yearHi), euroFmt),
    paybackFigure: c.tooSmall ? "—" : rangeFmt(c.payLo, c.payHi, monthsFmt),
    paybackUnit: c.tooSmall ? "" : " " + monthUnit,
    paybackNote: c.tooSmall ? t.tooSmall : t.paybackSub.replace("{BAND}", PRICING.band(lang)),
    brief: line1 + "\n" + line2 + "\n\n" + t.briefAsk
  };
}
/* SB_ROI:END */

function renderRoi(record) {
  var lang = state.lang;
  var t = appCopy("roi", lang);

    setHtml(record.body, "<h3>" + t.title + '</h3><p class="txt">' + esc(SYS_ERRORS.pricing) + "</p>");
    return;

function roiSliderHtml(id, label, hint, min, max, value) {

    (hint ? '<span class="s-hint">' + hint + "</span>" : "") + '</label><span class="s-out" id="' + id + 'Out"></span></div>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="1" value="' + value + '"></div>';

function roiFigureHtml(key, label, sub) {

    '<div class="f-sub" id="roi' + key + 'Sub">' + sub + "</div></div>";
}

/* 500ms linear count-up between figure endpoints; snaps under OS reduced
   motion. The at-rest string is always written exactly at the end. */
function animateFigure(node, from, to, format, finalText) {
  if (!from || osReducedMotion()) { node.textContent = finalText; return; }
  var start = performance.now();
  function frame(now) {
    var k = Math.min(1, (now - start) / 500);
    node.textContent = format(from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k);
    if (k < 1) requestAnimationFrame(frame); else node.textContent = finalText;
  }
  requestAnimationFrame(frame);
}

function roiUpdate(record, animate) {
  var lang = state.lang;
  var t = appCopy("roi", lang);
  var hours = parseInt($("#roiHours", record.body).value, 10);
  var people = parseInt($("#roiPeople", record.body).value, 10);
  var rate = parseInt($("#roiRate", record.body).value, 10);
  var out = roiStrings(hours, people, rate, lang);

  $("#roiHoursOut", record.body).textContent = out.hoursOut;
  $("#roiPeopleOut", record.body).textContent = out.peopleOut;
  $("#roiRateOut", record.body).textContent = out.rateOut;

  var prev = animate ? record.roiPrev : null;
  animateFigure($("#roitimeFig", record.body),
    prev && [prev.monthLo, prev.monthHi], [out.raw.monthLo, out.raw.monthHi],
    function (lo, hi) { return rangeFmt(lo, hi, intFmt); }, out.timeFigure);
  $("#roitimeUnit", record.body).textContent = out.timeUnit;

  animateFigure($("#roivalueFig", record.body),
    prev && [euroRound100(prev.yearLo), euroRound100(prev.yearHi)],
    [euroRound100(out.raw.yearLo), euroRound100(out.raw.yearHi)],
    function (lo, hi) { return rangeFmt(lo, hi, euroFmt); }, out.valueFigure);
  $("#roivalueUnit", record.body).textContent = "";

  var payNode = $("#roipayFig", record.body);
  if (out.tooSmall || !prev || prev.tooSmall) payNode.textContent = out.paybackFigure;
  else animateFigure(payNode, [prev.payLo, prev.payHi], [out.raw.payLo, out.raw.payHi],
    function (lo, hi) { return rangeFmt(lo, hi, monthsFmt); }, out.paybackFigure);
  $("#roipayUnit", record.body).textContent = out.paybackUnit;

  var noteNode = $("#roipaySub", record.body);
  noteNode.textContent = out.paybackNote;
  noteNode.classList.toggle("is-warn", out.tooSmall);
  $("#roiResults", record.body).classList.toggle("is-dimmed", out.tooSmall);

  record.roiPrev = out.raw;
  state.roiBrief = out.brief;
}

function roiHandoff() {

/* ------------------------------------------------------------------ chat */

function chatCopy(lang) { return appCopy("chat", lang || state.lang); }

/* Реплики системы хранятся КЛЮЧОМ, а не готовой строкой.
   ---------------------------------------------------------------------------
   12.08, дефект с телефона: шапка чата была по-русски, а само приветствие —
   по-английски. Перевод при этом существовал и был верным. Ломалась не
   локализация, а хранение: pushChat клал в историю уже собранный текст, и
   строка замерзала в том языке, который действовал в момент показа. Смена
   языка перерисовывала шапку (она читает словарь каждый раз) и не трогала
   пузыри (они читали копию).

   Правило: то, что написали МЫ, хранится ссылкой и переводится при отрисовке.
   То, что написал ЧЕЛОВЕК, хранится дословно и не переводится никогда — это
   его слова, а не наши. Отсюда два поля: key для наших, text для его. */
function pushChat(from, text, key, idx) {
  state.chat.history.push({
    from: from,
    text: text,
    key: key || null,          /* есть ключ ⇒ строка берётся из словаря при показе */
    idx: typeof idx === "number" ? idx : null,
    time: new Date().toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" })
  });
}

/* Единственное место, где ключ превращается в текст. Ключа нет — это слова
   человека, отдаём как есть. Ключ есть, а строки под ним не нашлось — отдаём
   то, что было показано в прошлый раз: молчащий пузырь хуже непереведённого. */
function chatText(message) {
  if (!message.key) return message.text;
  var t = chatCopy();
  if (message.key === "reply") {
    var list = t.replies || [];
    if (!list.length) return message.text;
    return list[message.idx % list.length] || message.text;
  }
  return t[message.key] || message.text;
}

function renderChat(record) {
  var t = chatCopy();
  state.chat.everOpened = true;
  if (!state.chat.history.length) pushChat("agent", t.welcome, "welcome");
  setHtml(record.body,
    '<div class="chat">' +
      '<div class="chat-head">' +
        '<div class="chat-avatar">' + esc(S.chat.avatarLetter) + "</div>" +
        "<div><div class='who'>" + esc(t.agent) + "</div>" +
        "<div class='st'>" + esc(t.status) + " · " + esc(t.note) + "</div></div>" +
      "</div>" +
      '<div class="chat-msgs" id="chatMsgs"></div>' +
      '<div class="chat-input">' +
        '<input class="mail" id="chatEmail" type="email" autocomplete="email" placeholder="' + esc(t.emailPh) + '">' +
        '<div class="chat-send-row">' +
          '<textarea id="chatText" rows="1" placeholder="' + esc(t.placeholder) + '"></textarea>' +
          '<button class="chat-send" id="chatSend" type="button" aria-label="' + esc(t.send) + '">' + svg("send") + "</button>" +
        "</div>" +
      "</div>" +
    "</div>");
  /* Чат ставит свои поля инлайном (у него собственная раскладка в высоту).
     Нижнее поле обязано уважать запас под доком: инлайн-стиль сильнее
     таблицы стилей, и без calc здесь строка ввода снова уезжала под док —
     закон dock-clearance-check краснел именно на этом окне. */
  record.body.style.padding = "16px 16px calc(14px + var(--dock-room,0px))";
  renderChatMessages(record);

  var text = $("#chatText", record.body);
  text.addEventListener("input", function () {
    text.style.height = "auto";
    text.style.height = Math.min(80, text.scrollHeight) + "px";
  });
  text.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); chatSend(record); }
  });
  $("#chatSend", record.body).addEventListener("click", function () { chatSend(record); });
}

function renderChatMessages(record) {
  var list = $("#chatMsgs", record.body);
  if (!list) return;
  setHtml(list, state.chat.history.map(function (message) {
    return '<div class="bubble from-' + message.from + '">' + esc(chatText(message)) +
      '<span class="time">' + esc(message.time) + "</span></div>";
  }).join(""));
  list.scrollTop = list.scrollHeight;
}

function chatSend(record) {
  var t = chatCopy();
  var textField = $("#chatText", record.body);
  var emailField = $("#chatEmail", record.body);
  var message = textField.value.trim();
  if (!message) return;

  var email = emailField.value.trim();
  var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  pushChat("user", message);
  textField.value = "";
  textField.style.height = "auto";

  if (!valid) {
    pushChat("agent", t.askEmail, "askEmail");
    renderChatMessages(record);
    emailField.focus();
    return;                                   /* no network request */
  }

  renderChatMessages(record);
  var list = $("#chatMsgs", record.body);
  var indicator = makeEl("div", "typing", "<i></i><i></i><i></i>");
  indicator.setAttribute("role", "status");
  indicator.setAttribute("aria-label", t.typing);   /* dots carry no text */
  list.appendChild(indicator);
  list.scrollTop = list.scrollHeight;

  var payload = new FormData();
  payload.append("email", email);
  payload.append("_subject", S.form.chatSubject);
  payload.append("message", message);
  var chatIntro = introCode();
  if (chatIntro) payload.append("Introduced by", chatIntro);

  var started = Date.now();
  fetch(ENDPOINT, { method: "POST", body: payload, headers: { Accept: "application/json" } })
    .then(function (response) {
      return response.text().then(function (text) { return acceptResponse(response, text); });
    })
    .catch(function () { return false; })
    .then(function (delivered) {
      var wait = Math.max(0, 900 - (Date.now() - started));   /* typing floor */
      setTimeout(function () {
        if (indicator.parentNode) indicator.remove();
        var replies = t.replies;
        var slot = delivered ? (state.chat.replyIndex++ % replies.length) : -1;
        var reply = delivered ? replies[slot] : t.failMsg;
        pushChat("agent", reply, delivered ? "reply" : "failMsg", delivered ? slot : null);
        deliverChatReply(reply);
      }, wait);
    });
}

function deliverChatReply(reply) {
  var record = wins.chat;
  var visible = record && !record.minimized && state.focused === "chat";
  if (visible) {
    renderChatMessages(record);
    chirp();
  } else {
    if (record) renderChatMessages(record);
    setChatBadge();
    toast(chatCopy().agent, reply, "chat", false);
    chirp();
  }
}

function chatWelcomePush() {
  if (state.chat.everOpened || wins.chat) return;
  /* ПРИВЕТСТВИЕ НЕ ПЕРЕБИВАЕТ РАБОТУ (v46). Тост всплывал поверх окна, которое
     человек только что открыл, и на телефоне закрывал его нижнюю треть — это
     же значилось открытым долгом у Совета внутреннего контура («тост оболочки
     перекрывает верх свежеоткрытого окна»). Правило простое: пока хоть одно
     окно открыто, приветствие ждёт. Значок чата всё равно получает отметку,
     так что предложение не теряется — оно перестаёт лезть поперёд. */
  for (var k in wins) { if (wins[k] && !wins[k].minimized) { setChatBadge(); return; } }
  var t = chatCopy();
  pushChat("agent", t.welcome, "welcome");
  setChatBadge();
  toast(t.agent, t.welcome, "chat", false);
  chirp();
}

/* --------------------------------------------------- toasts + soundcheck */

function toast(title, body, icon, forced) {
  if (state.prefs.dnd && !forced) return;
  var node = makeEl("div", "toast",
    '<div class="ic">' + svg(icon) + "</div>" +
    '<div><div class="t-title">' + esc(title) + '</div><div class="t-body">' + esc(body) + "</div></div>");
  el("toasts").appendChild(node);
  requestAnimationFrame(function () { node.classList.add("is-in"); });
  var timer = setTimeout(remove, 6200);
  node.addEventListener("click", remove);
  function remove() {
    clearTimeout(timer);
    node.classList.remove("is-in");
    setTimeout(function () { if (node.parentNode) node.remove(); }, 450);
  }
}

/* Notification chirp. DND deliberately does NOT silence it (faithful quirk). */
var audioCtx = null;
function chirp() {
  if (!state.prefs.sound || state.prefs.volume <= 0) return;
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    var now = audioCtx.currentTime;
    var peak = 0.22 * state.prefs.volume / 100;
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.linearRampToValueAtTime(1180, now + 0.28);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  } catch (err) {
    /* Audio unavailable (no device, blocked autoplay policy): silent by design,
       the visible toast already carries the notification. */
  }
}

/* Панель Preferences снята с витрины вместе с часами и статусом — код ушёл
