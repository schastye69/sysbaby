function renderPalette() {
  var query = el("palInput").value.trim().toLowerCase();
  var all = paletteItems();
  var matches = all.filter(function (item) {
    return !query || (item.title + " " + item.sub).toLowerCase().indexOf(query) !== -1;
  });
  state.palette.items = matches;
  if (state.palette.cur >= matches.length) state.palette.cur = 0;
  var list = el("palList");
  if (!matches.length) {
    setHtml(list, '<div class="pal-empty">' + esc(C.cmdkEmptyLabel[state.lang] || C.cmdkEmptyLabel.en) + "</div>");
    return;
  }
  setHtml(list, matches.map(function (item, i) {
    return '<button class="pal-item' + (i === state.palette.cur ? " is-cur" : "") + '" data-i="' + i + '">' +
      '<span class="p-ic">' + svg(item.icon) + "</span>" +
      "<span><span class='p-title'>" + esc(item.title) + "</span><br>" +
      "<span class='p-sub'>" + esc(item.sub) + "</span></span></button>";
  }).join(""));
  Array.prototype.forEach.call(list.children, function (node) {
    node.addEventListener("mouseenter", function () {
      state.palette.cur = parseInt(node.getAttribute("data-i"), 10);
      highlightPalette();
    });
    node.addEventListener("click", function () {
      state.palette.cur = parseInt(node.getAttribute("data-i"), 10);
      runPaletteItem();
    });
  });
}

function highlightPalette() {
  Array.prototype.forEach.call(el("palList").children, function (node, i) {
    if (node.classList) node.classList.toggle("is-cur", i === state.palette.cur);
  });
}

function runPaletteItem() {
  var item = state.palette.items[state.palette.cur];
  if (!item) return;
  closePalette();
  setTimeout(item.run, 160);
}

function openPalette() {
  state.palette.open = true;
  state.palette.cur = 0;
  el("palInput").value = "";
  el("palette").classList.add("is-open");
  renderPalette();
  setTimeout(function () { el("palInput").focus(); }, 50);
}

function closePalette() {
  state.palette.open = false;
  el("palette").classList.remove("is-open");
}

function togglePalette() { state.palette.open ? closePalette() : openPalette(); }

/* ------------------------------------------------------- OS handoff veil */

function isOsLink(anchor) {
  var href = anchor.getAttribute("href") || "";
  /* The canonical link is the directory, "os/". The explicit index.html form
     is still recognised so an older bookmark or a hand-written link behaves
     the same way. */
  return /(^|\/)os\/(index\.html)?(\?|#|$)/.test(href);
}

function wireHandoff() {
  document.addEventListener("click", function (ev) {
    var anchor = ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!anchor || ev.defaultPrevented) return;
    if (ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    if (anchor.target && anchor.target !== "_self") return;
    if (!isOsLink(anchor)) return;
    ev.preventDefault();
    /* "I came in through the front door" — the one bit of state the OS needs
       from the landing. It used to travel as ?enter=1 in the address bar;
       it travels in session storage now, so the URL stays /os/. */
    try { window.sessionStorage.setItem("sysbaby.enter", "1"); } catch (err) { /* storage blocked */ }
    var href = anchor.getAttribute("href");
    if (osReducedMotion()) { location.href = href; return; }
    var veil = el("veil");
    var navigated = false;
    function go() { if (!navigated) { navigated = true; location.href = href; } }
    veil.addEventListener("transitionend", go, { once: true });
    setTimeout(go, 580);                       /* fallback: never strand the user */
    requestAnimationFrame(function () { veil.classList.add("is-up"); });
  });
  window.addEventListener("pageshow", function () { el("veil").classList.remove("is-up"); });
}

/* ---------------------------------------------------------------- wiring */

function wireChrome() {
  el("cmdkTrigger").addEventListener("click", openPalette);
  el("palBackdrop").addEventListener("click", closePalette);
  el("palInput").addEventListener("input", function () { state.palette.cur = 0; renderPalette(); });
  el("palInput").addEventListener("keydown", function (ev) {
    var count = state.palette.items.length;
    if (!count && (ev.key === "ArrowDown" || ev.key === "ArrowUp" || ev.key === "Enter")) {
      ev.preventDefault();                     /* nothing to move through */
      return;
    }
    if (ev.key === "ArrowDown") { ev.preventDefault(); state.palette.cur = (state.palette.cur + 1) % count; highlightPalette(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); state.palette.cur = (state.palette.cur - 1 + count) % count; highlightPalette(); }
    else if (ev.key === "Enter") { ev.preventDefault(); runPaletteItem(); }
  });

  Array.prototype.forEach.call(el("langs").children, function (button) {
    button.addEventListener("click", function () { setLang(button.getAttribute("data-lang")); });
  });

  /* ЯЗЫК В ССЫЛКЕ. sys.baby/?lang=ee открывается по-эстонски.
     -------------------------------------------------------------------------
     Зачем. Каждая загрузка начинается по-английски — это решение о витрине и
     оно остаётся. Но холодный контакт — другой случай: эстонскому владельцу
     бизнеса, которому отправили ссылку, нельзя выдавать чужой язык и надеяться,
     что он сам найдёт флаг. Теперь язык несёт ссылка, а тот, кто пришёл сам,
     по-прежнему видит английский.
     Адрес чистится сразу: в строке остаётся sys.baby, а не sys.baby/?lang=ee —
     язык это состояние сессии, а не часть адреса страницы. */
  try {
    var langQ = /[?&]lang=(en|ru|ee|fi)(&|$)/.exec(location.search);
    if (langQ) {
      setLang(langQ[1]);
      /* Снимается ИМЕННО lang — см. sbDropParams в первом сценарии страницы.
         Прежняя строка снимала весь запрос и уносила с собой соседей. */
      if (window.sbDropParams) window.sbDropParams(["lang"]);
    }
  } catch (err) { /* history заблокирована — язык уже применён, и этого достаточно */ }

  /* ── СИСТЕМА ПРОСИТ ОТКРЫТЬ РАЗДЕЛ (v47.3) ──────────────────────────────
     Вторая половина двери sbOpenBuildAt. Когда окно build ЕЩЁ НЕ открыто,
     раздел приходит адресом (?open=cases — читает startBoot). Когда окно
     УЖЕ открыто — приходит сюда сообщением: перезагружать живую витрину
     ради прокрутки было бы грубо и стоило бы всей её загрузки заново.
     Обработчик обязан жить в ЭТОМ сценарии: appCopyExists и openApp
     объявлены здесь, и первая редакция, положившая его в первый инлайн-
     сценарий, падала с ReferenceError — нашёл прогон final-gate.
     Имя раздела проверяется по данным витрины: чужое сообщение не может
     открыть то, чего нет. */
  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d || d.sysbaby !== "open-section") return;
    var id = String(d.section || "");
    if (!appCopyExists(id)) return;
    try { openApp(id); } catch (e) { console.error("[handoff] open-section failed", e); }
  });

  el("ctaRequest").addEventListener("click", function (ev) { ev.preventDefault(); openApp("order"); });

  document.addEventListener("keydown", function (ev) {
    if ((ev.metaKey || ev.ctrlKey) && (ev.key === "k" || ev.key === "K")) { ev.preventDefault(); togglePalette(); return; }
    if (ev.key === "Escape") {
      if (state.palette.open) { closePalette(); return; }
      if (state.focused) closeWindow(state.focused);
    }
  });

  /* click on empty desktop unfocuses every window */
  document.addEventListener("pointerdown", function (ev) {
    if (ev.target.closest(".win, .dock, .topbar, .palette, .cc, .toasts")) return;
    blurWindows();
  });

  /* dock behaviours */
  var dock = el("dock");
  dock.addEventListener("pointermove", function (ev) { dockMagnify(ev); armAutoHide(); });
  dock.addEventListener("pointerleave", dockMagnifyReset);
  dock.addEventListener("pointerdown", function () { armAutoHide(); });
  window.addEventListener("pointermove", function (ev) {
    if (ev.clientY >= window.innerHeight - 130) showDock(ev);
  });
  window.addEventListener("touchstart", function (ev) {
    var touch = ev.touches && ev.touches[0];
    if (touch && touch.clientY >= window.innerHeight - 130) showDock(ev);
  }, { passive: true });

  /* pause looping cosmetics while the tab is hidden */
  document.addEventListener("visibilitychange", function () {
    document.documentElement.setAttribute("data-anim", document.hidden ? "paused" : "running");
  });
}

/* -------------------------------------------------------------- backdrop */

/* Поле частиц и видеофон удалены вместе с их кодом: холст #bg исчез из
   разметки задолго до этого прохода, и startField() выходил на первой же
   строке — девяносто строк, которые никогда не рисовали. Видео жило на CDN
   GoDaddy и было единственной внешней зависимостью страницы. Фон теперь —
   собственное поле --bg, и единственное, что осталось от этого раздела, —
   пересчёт заголовка при изменении окна. */
function wireResize() {
  /* Кегль заголовка пересчитывается по самому длинному слову, ширина
     надстрочника — по самой длинной строке заголовка. Порядок обязателен:
     сначала заголовок принимает размер, только потом под него подгоняется
     строка-имя. */
  window.addEventListener("resize", function () {
    measureHeroFit();
    fitHeroName();
    fitCtaRow();
    /* Зона дока меняется вместе с экраном: на 620px у плиток пропадают
       подписи, на низком экране док садится на кромку. Запас пересчитывается
       вместе с ней, иначе он верен только на той ширине, где его считали. */
    reserveDockRoomAll();
  });
  /* Метрики системного шрифта приходят позже первой отрисовки: без этого
     строка-имя подгоняется под ещё не тот заголовок, а кегль клавиш —
     под ещё не те подписи. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { fitHeroName(); fitCtaRow(); });
  }
}

/* ------------------------------------------------------------------ init */

function init() {
  document.title = S.documentTitle;
  el("cmdkTriggerLabel").textContent = C.cmdkLabels[state.lang].triggerLabel;
  el("tbApp").textContent = C.desktopLabel[state.lang];
  renderHero();
  buildDock();
  applyPrefs();
  renderHeroProof();
  wireChrome();
  wireHandoff();
  wireResize();
  startBoot();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
</script>
