<body>
<div id="sbTestBadge" role="status" aria-live="polite">ТЕСТ · сборка <b>v50</b> · рабочий стол</div><script id="sb-test-badge-js">(function(){
  /* Заголовок вкладки помечается сразу и остаётся помеченным: страница может
     переписать document.title у себя (лендинг это делает при смене языка),
     поэтому метка ставится не один раз, а держится наблюдателем. */
  var TAG="[ТЕСТ] ";
  function tag(){ if(document.title.indexOf(TAG)!==0) document.title=TAG+document.title; }
  tag();
  try{ new MutationObserver(tag).observe(document.querySelector("title")||document.head,{subtree:true,characterData:true,childList:true}); }catch(e){}
  var el=document.getElementById("sbTestBadge");
  if(el) setTimeout(function(){ el.classList.add("is-quiet"); },5000);
})();</script>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   PHOSPHOR — играбельное демо. Реестр миров (итерация: Миры 0–5 + Разрез)
   Всё процедурно: ноль ассетов/текстур/аудиофайлов/исходящих байт.
   Жесты: вести — смотреть; задержаться — отвердить; дольше — вес/прожиг;
   клавиша / 2-пальц. тап / встряхнуть — Моргнуть; Esc / 2 пальца 1.2с — вуаль;
   R / 2 пальца 3.5с — рестарт мира; F — полный экран.
   ===================================================================== */
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const oldH=H;
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(world===0)layoutWord();
  else if(world>=1&&world<=LAST&&!portal&&oldH>0&&Math.abs(H-oldH)/oldH>0.25){
    buildWorld(world);flashT=now/1000; // поворот экрана: мир пере-дышал
  }
}
addEventListener('resize',fit);
if(window.visualViewport)visualViewport.addEventListener('resize',fit);

/* ---------- палитра/время/взгляд ---------- */
let WD={hue:38,root:110,mode:[0,4,7,9,12,16],amb:900};
const light=(l,a)=>`hsla(${WD.hue},95%,${l}%,${a})`;
const lightH=(h,l,a)=>`hsla(${h},95%,${l}%,${a})`;
let now=performance.now(),dt=0,tempo=1,lastMoveT=0,gaps=[];
let perfEMA=0.0166,lowPerf=false,trailMax=800;
const gaze={x:-999,y:-999,px:-999,py:-999,alive:false};
let dirSign=0,flips=0,flipT=0;
function onMove(x,y){
  const tn=performance.now();
  if(gaze.alive&&!pureMode){
    const gap=tn-lastMoveT;
    if(gap>40&&gap<1500){gaps.push(gap);if(gaps.length>24)gaps.shift();
      const med=[...gaps].sort((a,b)=>a-b)[gaps.length>>1];
      tempo=Math.min(1.6,Math.max(0.7,med/220));}
    const dx=x-gaze.x,s=Math.sign(dx);
    if(s!==0&&s!==dirSign){if(tn-flipT<300){flips++;if(flips>=4){flips=0;blink();}}else flips=1;flipT=tn;dirSign=s;}
  } else if(gaze.alive){
    const dx=x-gaze.x,s=Math.sign(dx);
    if(s!==0&&s!==dirSign){if(tn-flipT<300){flips++;if(flips>=4){flips=0;blink();}}else flips=1;flipT=tn;dirSign=s;}
  }
  lastMoveT=tn;
  gaze.px=gaze.x;gaze.py=gaze.y;gaze.x=x;gaze.y=y;gaze.alive=true;
  wake();ensureAudio();
  if(AC&&AC.state==='suspended')AC.resume(); // платформа могла игнорировать resume без жеста
}
const gaze2={x:0,y:0,px:0,py:0,alive:false};
const ptrs=new Map();let firstId=null;
function syncPtrs(){
  const ids=[...ptrs.keys()];
  if(firstId===null||!ptrs.has(firstId))firstId=ids.length?ids[0]:null;
  const second=ids.find(id=>id!==firstId);
  if(second!==undefined){const p=ptrs.get(second);
    gaze2.px=gaze2.alive?gaze2.x:p.x;gaze2.py=gaze2.alive?gaze2.y:p.y;
    gaze2.x=p.x;gaze2.y=p.y;gaze2.alive=true;}
  else gaze2.alive=false;
}
let pinchD=0;
function ptrEvt(e){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});syncPtrs();
  if(ptrs.size>=2&&WORLD.def&&WORLD.def.press){
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0&&d<pinchD)WORLD.def.press((pinchD-d)/H*2.0);
    pinchD=d;
  }else pinchD=0;
  if(e.pointerId===firstId)onMove(e.clientX,e.clientY);
}
addEventListener('pointerdown',ptrEvt,{passive:true});
addEventListener('pointerdown',e=>{ // рябь: мир отвечает на прикосновение
  if(veil)return;
  ripples.push({x:e.clientX,y:e.clientY,t:0});
  pluck(160+(1-e.clientY/H)*420,0.028,(e.clientX/W-0.5)*1.2);
  if(WORLD.def&&WORLD.def.onTap)WORLD.def.onTap(e.clientX,e.clientY);
},{passive:true});
addEventListener('pointermove',ptrEvt,{passive:true});
const ptrDel=e=>{ptrs.delete(e.pointerId);syncPtrs();};
addEventListener('pointerup',ptrDel,{passive:true});
addEventListener('pointercancel',ptrDel,{passive:true});
let twoT=0,twoVeil=null,twoRestart=null;
addEventListener('touchstart',e=>{
  const duet=WORLD.def&&(WORLD.def.duet||WORLD.def.press);
  if(e.touches.length===3&&duet){restartWorld();return;} // в Дуэте: 3 пальца = рестарт
  if(e.touches.length===2&&!duet){twoT=performance.now();
    twoVeil=setTimeout(()=>{setVeil(!veil);twoVeil=null;},1200);
    twoRestart=setTimeout(()=>{restartWorld();twoRestart=null;},3500);}
},{passive:true});
addEventListener('touchend',()=>{
  if(twoVeil){clearTimeout(twoVeil);twoVeil=null;
    if(performance.now()-twoT<350)blink();}
  if(twoRestart){clearTimeout(twoRestart);twoRestart=null;}
},{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)onMove(t.clientX,t.clientY);e.preventDefault();},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){setVeil(!veil);return;}
  if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К'){restartWorld();return;}
  if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(_){}return;}
  blink();
});
addEventListener('wheel',e=>{
  if(WORLD.def&&WORLD.def.press&&e.deltaY>0)WORLD.def.press(Math.min(0.12,e.deltaY*0.0015));
},{passive:true});

/* ---------- звук ---------- */
let AC=null,master=null,duckG=null,ambBQ=null,ambG=null,fund=null;
const F=deg=>WD.root*Math.pow(2,deg/12);
function ensureAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    duckG=AC.createGain();duckG.gain.value=1;duckG.connect(AC.destination);
    master=AC.createGain();master.gain.value=0;master.connect(duckG);
    master.gain.linearRampToValueAtTime(0.5,AC.currentTime+2);
    const len=2*AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    let v=0;for(let i=0;i<len;i++){v=v*0.98+(Math.random()*2-1)*0.02;d[i]=v*3;}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    ambBQ=AC.createBiquadFilter();ambBQ.type='bandpass';ambBQ.frequency.value=WD.amb;ambBQ.Q.value=1.2;
    ambG=AC.createGain();ambG.gain.value=0;
    src.connect(ambBQ);ambBQ.connect(ambG);ambG.connect(master);src.start();
    ambG.gain.linearRampToValueAtTime(0.018,AC.currentTime+3);
    fund=voice(WD.root,0,0.1);vfade(fund,0.07,3);
  }catch(_){AC=null;}
}
function voice(freq,g0,att,pan){
  if(!AC)return null;
  const o=AC.createOscillator();o.type='sine';o.frequency.value=freq;
  const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=freq*2;
  const g2=AC.createGain();g2.gain.value=0.35;o2.connect(g2);
  const g=AC.createGain();g.gain.value=0;
  o.connect(g);g2.connect(g);
  let p=null;
  if(AC.createStereoPanner){p=AC.createStereoPanner();p.pan.value=pan||0;g.connect(p);p.connect(master);}
  else g.connect(master);
  o.start();o2.start();
  if(g0>0)g.gain.linearRampToValueAtTime(g0,AC.currentTime+att);
  return{o,o2,g,p};
}
function vpan(v,t,s){if(v&&v.p&&AC)v.p.pan.linearRampToValueAtTime(t,AC.currentTime+s);}
function pluck(freq,g0,pan){ // короткая нота с авто-остановкой (мелодия, плюхи)
  if(!AC)return;
  const o=AC.createOscillator();o.type='sine';o.frequency.value=freq;
  const g=AC.createGain();g.gain.value=0;o.connect(g);
  let out=g;
  if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan||0;g.connect(p);out=p;}
  out.connect(master);
  const t=AC.currentTime;
  g.gain.linearRampToValueAtTime(g0,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
  o.start(t);o.stop(t+1.2);
}
function thud(){ // мир вздрагивает
  if(!AC)return;
  const o=AC.createOscillator();o.type='sine';o.frequency.value=60;
  const g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(master);
  const t=AC.currentTime;
  g.gain.linearRampToValueAtTime(0.22,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  o.frequency.exponentialRampToValueAtTime(38,t+0.4);o.start(t);o.stop(t+0.55);
}
function sneezeSound(){ // мир чихает
  if(!AC)return;
  const o=AC.createOscillator();o.type='sine';o.frequency.value=620;
  const g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(master);
  const t=AC.currentTime;
  g.gain.linearRampToValueAtTime(0.08,t+0.03);
  o.frequency.exponentialRampToValueAtTime(85,t+0.4);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.start(t);o.stop(t+0.55);
}
function vfade(v,t,s){if(v&&AC)v.g.gain.linearRampToValueAtTime(t,AC.currentTime+s);}
function vglide(v,f,s){if(v&&AC){v.o.frequency.linearRampToValueAtTime(f,AC.currentTime+s);v.o2.frequency.linearRampToValueAtTime(f*2,AC.currentTime+s);}}
function gate(){if(!AC)return;
  duckG.gain.cancelScheduledValues(AC.currentTime);
  duckG.gain.setTargetAtTime(0,AC.currentTime,0.004);
  duckG.gain.setTargetAtTime(1,AC.currentTime+0.55,0.12);}
function duck(on){if(AC)duckG.gain.setTargetAtTime(on?0.12:1,AC.currentTime,0.25);}
function worldAudio(){if(!AC)return;vglide(fund,WD.root,2.5);ambBQ.frequency.linearRampToValueAtTime(WD.amb,AC.currentTime+2.5);}

/* ---------- след ---------- */
const trail=[];
function emitTrail(){
  if(!gaze.alive||veil)return;
  const sp=Math.hypot(gaze.x-gaze.px,gaze.y-gaze.py),n=Math.min(4,1+(sp/12|0));
  for(let i=0;i<n;i++){const f=i/n;
    trail.push({x:gaze.px+(gaze.x-gaze.px)*f,y:gaze.py+(gaze.y-gaze.py)*f+camY,age:0,life:(2.2+Math.random()*1.4)*tempo});}
  if(gaze2.alive){ // след второго взгляда — тише первого
    const sp2=Math.hypot(gaze2.x-gaze2.px,gaze2.y-gaze2.py),n2=Math.min(2,1+(sp2/18|0));
    for(let i=0;i<n2;i++){const f=i/n2;
      trail.push({x:gaze2.px+(gaze2.x-gaze2.px)*f,y:gaze2.py+(gaze2.y-gaze2.py)*f+camY,age:0.3,life:(2.0+Math.random())*tempo});}
  }
  if(trail.length>trailMax)trail.splice(0,trail.length-trailMax);
}

/* ---------- светоформы ---------- */
let forms=[];
function mkForm(o){return Object.assign({dwell:0,solid:false,note:null,wob:Math.random()*6.28,player:true,
  growT:0.9,decayT:3.2,wither:false,burn:0,r:0.05,sv:0,so:0},o);}
function formNote(f,g){
  if(!AC||f.note)return;
  const pan=(f.pan!==undefined)?f.pan:Math.max(-0.8,Math.min(0.8,(f.x-0.5)*1.2));
  f.note=voice(F(WD.mode[(f.deg||0)%WD.mode.length]),g||0.05,0.8,pan);
}
function killNote(f,slow){
  if(!f.note)return;
  if(AC){vglide(f.note,f.note.o.frequency.value*0.5,slow?1.4:0.3);
    if(slow)vpan(f.note,(f.note.p?f.note.p.pan.value:0)*0.2,1.4); // тонет — сужается к центру
    vfade(f.note,0,slow?1.6:0.35);}
  f.note=null;
}
function hitTest(f){
  if(veil)return false;
  const sx=f.x*W,sy=f.y-camY,r=Math.max(H*0.09,W*0.09);
  for(const g of[gaze,gaze2]){
    if(!g.alive)continue;
    if(f.side==='L'&&g.x>W/2)continue; // мембрана: взгляд лишь со своей стороны
    if(f.side==='R'&&g.x<W/2)continue;
    if(Math.hypot(g.x-sx,g.y-sy)<r)return true;
  }
  return false;
}
/* общая шкала взгляда: reveal→solid (+wither, +decay по параметрам формы) */
function upForms(){
  for(const f of forms){
    if(!f.interactive)continue;
    const hit=hitTest(f);
    if(f.wither){ // Мир 4: под взглядом вянет; в тени взгляда — растёт
      const inShade=WORLD.def&&WORLD.def.inShade?WORLD.def.inShade():false;
      if(hit)f.dwell=Math.max(0,f.dwell-dt*0.8);
      else if(inShade)f.dwell=Math.min(1,f.dwell+dt/(1.5*tempo));
      else f.dwell=Math.max(0,f.dwell-dt/(8*tempo));
      if(f.dwell>=1&&!f.solid){f.solid=true;f.sv-=180;if(pureMode)pureSolids++;if(!(WORLD.def&&WORLD.def.mute))formNote(f);}
      continue;
    }
    if(!f.solid){
      f.dwell+=hit?dt/(f.growT*tempo):(lockDecay?0:-dt/(f.decayT*tempo));
      f.dwell=Math.max(0,Math.min(1,f.dwell));
      if(f.dwell>=1){f.solid=true;f.sv-=180;if(pureMode)pureSolids++;if(!(WORLD.def&&WORLD.def.mute))formNote(f);}
    }else if(f.decaySolid&&!flowOn&&!lockDecay){
      f.dwell+=hit?dt*1.5:-dt/(14*tempo);
      f.dwell=Math.min(1,f.dwell);
      if(f.dwell<=0.35){f.solid=false;f.dwell=0.32;killNote(f,true);}
    }
  }
}

/* ---------- Моргание ---------- */
let blinkT=-9,flashT=-9,lastBlinkT=-99;
function blink(){
  const tn=now/1000;
  if(tn-blinkT<0.25||veil)return;
  blinkT=tn;flashT=tn;lastBlinkT=tn;gate();
  if(pureMode&&world<=LAST&&pureDone===0)pureBlinks++;
  blinkHist.push(tn);blinkHist=blinkHist.filter(t=>tn-t<3);
  if(blinkHist.length>=4){blinkHist.length=0;shakeT=0.3;sneezeSound(); // мир чихает
    for(const f of forms)f.sv-=100+Math.random()*140;
    for(let i=0;i<16;i++)dust.push({x:Math.random()*W,y:camY+Math.random()*H,
      vy:-30-Math.random()*60,age:0,life:1.6});}
  if(showVit){showVit=false;trail.length=0;return;}
  for(const f of forms){
    if(WORLD.def&&WORLD.def.blinkKeeps&&WORLD.def.blinkKeeps(f))continue;
    if(f.player&&f.erasable!==false&&!lockDecay){
      if(f.solid)f.solid=false;
      f.dwell=0;f.burn=0;killNote(f,false);
    }
  }
  if(WORLD.def&&WORLD.def.onBlink)WORLD.def.onBlink();
  trail.length=0;
}

/* ---------- частицы/камера/вуаль ---------- */
const pollen=[],dust=[];
function seedPollen(vy,count){pollen.length=0;
  for(let i=0;i<count;i++)pollen.push({x:Math.random()*W,y:vy-H*1.4+Math.random()*H*1.8,ph:Math.random()*6.28,s:2+Math.random()*2});}
let camY=0,flowOn=false,vacY=0,lockDecay=false;
let veil=false,veilT=0;
function setVeil(v){veil=v;veilT=performance.now();duck(veil);}
function wake(){if(veil&&performance.now()-veilT>800)setVeil(false);}
let unseenGift=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(AC)AC.suspend();}
  else{if(AC)AC.resume();unseenGift=true;}
});

/* ---------- Мир 0: слово ---------- */
const WORDS0='PHOSPHOR';
let letters=[],fontPx=64,sub=null,fallP=0;
function layoutWord(){
  fontPx=Math.min(W*0.105,H*0.17);
  ctx.font=`600 ${fontPx}px Georgia,'Times New Roman',serif`;
  const spacing=fontPx*0.14;let total=0;const ws=[];
  for(const ch of WORDS0){const w=ctx.measureText(ch).width;ws.push(w);total+=w+spacing;}
  total-=spacing;let x=(W-total)/2;const y=H*0.42;
  const prev=letters;
  letters=[...WORDS0].map((ch,i)=>{const L={ch,x:x+ws[i]/2,y,w:ws[i],
    dwell:prev[i]?prev[i].dwell:0,solid:prev[i]?prev[i].solid:false,
    note:prev[i]?prev[i].note:null,drop:0,wob:Math.random()*6.28};
    x+=ws[i]+spacing;return L;});
}

/* ---------- порталы ---------- */
let portal=null;
function startPortal(type){
  lockDecay=true;
  const notes=(world===0?letters:forms).filter(o=>o.note);
  notes.forEach((o,i)=>setTimeout(()=>killNote(o,true),i*140));
  if(sub){vfade(sub,0,2);sub=null;}
  portal={type,t:0,parts:null};
}
function portalDur(t){return{1:1.7,2:1.9,3:2.6,4:2.0,5:2.2,6:2.1,7:1.8,8:2.1,9:2.3,10:2.2,11:2.2,12:2.4,13:2.2,14:2.3,15:2.2,16:2.2,17:2.5,18:2.2,19:2.0,20:2.7,21:2.2,22:2.2,23:2.2,24:2.2,25:2.1,26:2.2,27:2.2,28:2.1,29:2.2,30:2.2,31:2.2,32:2.2,33:2.3,34:2.1,35:2.2,36:2.3,37:2.2,38:2.4,39:2.2,40:2.2,41:2.2,42:2.2,43:2.2,44:2.3,45:2.3,46:2.2,47:2.2,48:2.3,49:2.2,50:2.6}[t]||2;}

/* =====================================================================
   РЕЕСТР МИРОВ. Каждый: одна новая идея. def={hue,root,mode,amb,portal,
   build(), tick(), draw(breath), onBlink(), inShade()}
   ===================================================================== */
const DEFS=[
/* --- Мир 1 «Русло»: композиция и распад (очередь нежности) --- */
{hue:96,root:98,mode:[0,3,7,10,12,15],amb:700,portal:2,vac:2.1,
 build(){
   forms.push(mkForm({kind:'anchor',player:false,interactive:false,x:0.16,y:H*0.52,r:0.055,deg:0}));
   forms.push(mkForm({kind:'anchor',player:false,interactive:false,x:0.84,y:H*0.52,r:0.055,deg:4}));
   forms.push(mkForm({kind:'seed',interactive:true,decaySolid:true,x:0.385,y:H*0.55,deg:1}));
   forms.push(mkForm({kind:'seed',interactive:true,decaySolid:true,x:0.615,y:H*0.55,deg:2}));
   forms.filter(f=>f.kind==='anchor').forEach(f=>{f.solid=true;formNote(f,0.03);});
 },
 tick(){const s=forms.filter(f=>f.kind==='seed');
   if(!flowOn&&s.every(f=>f.solid)){flowOn=true;lockDecay=true;}},
 draw(breath){ // нить русла

let world=0,fossils=[];for(let i=0;i<=LAST;i++)fossils.push([]);
let vitT=0,vitC=null,showVit=false; // Витраж: экспорт прохождения
let pureMode=false,pureT=0,pureBlinks=0,pureSolids=0,pureDone=0,pglassT=0; // «Чистое стекло»
let musT=0,musIdx=0,shakeT=0,flowMarked=false;const ripples=[];let blinkHist=[];
const WORLD={def:null};

/* ---------- сборка/рестарт ---------- */
function silence(){
  for(const f of forms)killNote(f,false);
  for(const L of letters)if(L.note){if(AC)vfade(L.note,0,0.3);L.note=null;}
  if(sub){vfade(sub,0,0.3);sub=null;}
}
let state='AWAIT',stateT=0;
function setState(s){state=s;stateT=0;}
function buildWorld(n){
  if(WORLD.def&&WORLD.def.stopAudio)WORLD.def.stopAudio();
  silence();letters=[];forms=[];portal=null;
  world=n;camY=0;flowOn=false;lockDecay=false;trail.length=0;
  musT=0;musIdx=0;flowMarked=false;ripples.length=0;shakeT=0;
  if(n===0){WD={hue:38,root:110,mode:[0,4,7,9,12,16],amb:900};WORLD.def=null;
    layoutWord();setState('AWAIT');vacY=0;worldAudio();
    if(AC&&ambG)ambG.gain.setTargetAtTime(0.018,AC.currentTime,1.5);return;}
  if(n>=1&&n<=LAST){
    const d=DEFS[n-1];WORLD.def=d;
    WD={hue:d.hue,root:d.root,mode:d.mode,amb:d.amb};
    vacY=H*d.vac;seedPollen(vacY,lowPerf?80:120);
    d.build();setState('PLAY');worldAudio();
    if(AC&&ambG)ambG.gain.setTargetAtTime(d.ambGain!==undefined?d.ambGain:0.018,AC.currentTime,1.5);
    return;}
  WD={hue:252,root:55,mode:[0,7,12],amb:260};WORLD.def=null;
  if(pureMode&&pureDone===0)pureDone=Math.max(0.1,pureT); // финиш «Чистого стекла»
  setState('SLICE');worldAudio();
}
function restartWorld(){if(portal)return;
  if(world>LAST)pureMode=false;
  buildWorld(world>LAST?0:world);flashT=now/1000;gate();}
function fossilize(){fossils[world]=trail.slice(-200).map(p=>({x:p.x,y:p.y-camY}));}
function nextWorld(){buildWorld(world+1);}
function makeVitrail(){
  const vw=900,vh=1200,vc=document.createElement('canvas');
  vc.width=vw;vc.height=vh;const v=vc.getContext('2d');
  v.fillStyle='#050308';v.fillRect(0,0,vw,vh);
  const NP=LAST+1;
  v.globalCompositeOperation='lighter';
  for(let wi=0;wi<NP;wi++){
    const hue=wi===0?38:DEFS[wi-1].hue;
    const y=vh*(0.10+wi*(0.74/NP));
    const g=v.createLinearGradient(0,y-vh*0.028,0,y+vh*0.028);
    g.addColorStop(0,`hsla(${hue},95%,40%,0)`);
    g.addColorStop(0.5,`hsla(${hue},95%,48%,0.16)`);
    g.addColorStop(1,`hsla(${hue},95%,40%,0)`);
    v.fillStyle=g;v.fillRect(vw*0.06,y-vh*0.028,vw*0.88,vh*0.056);
    for(const m of fossils[wi]){
      const fx=vw*0.08+(m.x/W)*vw*0.84,fy=y+((m.y/H)-0.45)*vh*0.05;
      const r=v.createRadialGradient(fx,fy,0,fx,fy,7);
      r.addColorStop(0,`hsla(${hue},95%,65%,0.5)`);r.addColorStop(1,`hsla(${hue},95%,50%,0)`);
      v.fillStyle=r;v.beginPath();v.arc(fx,fy,7,0,6.283);v.fill();}
  }
  // жила пути сквозь толщу
  v.lineWidth=3;v.beginPath();
  const vx0=vw*0.5;v.moveTo(vx0,vh*0.06);
  for(let y=vh*0.06;y<=vh*0.88;y+=vh*0.015)
    v.lineTo(vx0+Math.sin(y*0.012)*vw*0.02,y);
  const vg=v.createLinearGradient(0,vh*0.06,0,vh*0.88);
  vg.addColorStop(0,'hsla(38,95%,70%,0.35)');vg.addColorStop(1,'hsla(252,95%,70%,0.35)');
  v.strokeStyle=vg;v.stroke();
  // реликвия-окно
  v.strokeStyle='hsla(252,95%,72%,0.5)';v.lineWidth=2;
  v.strokeRect(vw*0.44,vh*0.028,vw*0.12,vh*0.052);
  // аккорд-подпись: штрих на мир, высота — по фундаменту лада
  for(let wi=0;wi<NP;wi++){
    const hue=wi===0?38:DEFS[wi-1].hue;
    const root=wi===0?110:DEFS[wi-1].root;
    const x=vw*0.10+wi*(vw*0.80/(NP-1));
    const h=vh*0.02+((root-25)/(110-25))*vh*0.05;
    v.strokeStyle=`hsla(${hue},95%,65%,0.55)`;v.lineWidth=3;
    v.beginPath();v.moveTo(x,vh*0.955);v.lineTo(x,vh*0.955-h);v.stroke();}
  vitC=vc;showVit=true;
  if(AC){ // аккорд-подпись слышен: квинтовая стопка
    [1,1.5,3].forEach((m,i)=>{const u=voice(55*m,0,0.05);
      vfade(u,0.05/(1+i*0.5),0.4);setTimeout(()=>vfade(u,0,1.6),700+i*200);});}
  try{const a=document.createElement('a');
    a.href=vc.toDataURL('image/png');a.download='PHOSPHOR_vitrail.png';a.click();}catch(_){}
}

/* ---------- обновление ---------- */
function update(){
  stateT+=dt;emitTrail();
  const slow=(state==='SLICE')?3:1;
  for(const p of trail)p.age+=dt/slow;
  for(let i=trail.length-1;i>=0;i--)if(trail[i].age>trail[i].life)trail.splice(i,1);
  for(const p of pollen)p.ph+=dt;
  if(unseenGift){unseenGift=false;
    for(let i=0;i<14;i++)dust.push({x:Math.random()*W,y:camY+Math.random()*H,vy:-8-Math.random()*10,age:0,life:3});}
  for(const d of dust){d.y+=d.vy*dt;d.age+=dt;}
  for(let i=dust.length-1;i>=0;i--)if(dust[i].age>dust[i].life)dust.splice(i,1);
  if(veil)return;
  shakeT=Math.max(0,shakeT-dt);
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>0.9)ripples.splice(i,1);}
  if(AC&&(world!==0||state!=='AWAIT')){ // музыка мира: арпеджио лада в слышимом регистре
    musT+=dt;
    const per=(state==='SLICE')?1.3*tempo:0.55*tempo;
    if(musT>=per){musT-=per;
      const md=WD.mode,len=md.length,st=(world%(len-1))+1;
      const k=musIdx++;
      if(k%4!==3){ // четвёртая доля — вдох
        const mult=WD.root<45?8:4;
        pluck(F(md[(k*st)%len])*mult,(portal?0.010:0.020),((k%2)?0.25:-0.25));}}
  }
  if(pureMode&&world<=LAST&&pureDone===0&&!portal)pureT+=dt; // до ранних return миров

  if(portal){
    portal.t+=dt;
    if(portal.type===2&&!portal.parts){portal.parts=[];
      for(let i=0;i<(lowPerf?160:260);i++)portal.parts.push({x:Math.random()*W,y:Math.random()*H,d:0.4+Math.random()});}
    if(portal.t>portalDur(portal.type))nextWorld();
    return;
  }

  if(world===0){
    if(state==='AWAIT'){if((gaze.alive&&stateT>3.2)||stateT>12)setState('WORD');}
    else if(state==='WORD'){
      let all=true;
      for(const L of letters){
        const r=Math.max(L.w*0.75,fontPx*0.55);
        const hit=gaze.alive&&Math.hypot(gaze.x-L.x,gaze.y-L.y)<r;
        if(!L.solid){
          L.dwell+=hit?dt/(0.85*tempo):-dt/(2.6*tempo);
          L.dwell=Math.max(0,Math.min(1,L.dwell));
          if(L.dwell>=1){L.solid=true;L.sv=-170;if(pureMode)pureSolids++;
            const k=letters.filter(l=>l.solid).length-1;
            if(AC)L.note=voice(WD.root*[1,1.5,2,3,4,5,6,8][Math.min(k,7)],0.05/(1+k*0.3),0.8);}
          all=false;}
      }
      if(all&&letters.length)setState('HEAVY');
    }
    else if(state==='HEAVY'){
      const p=Math.min(1,stateT/(2.4*tempo));
      for(const L of letters)L.drop=p*fontPx*0.10*(0.7+0.3*Math.sin(L.wob));
      if(!sub&&AC){sub=voice(WD.root/2,0,0.1);vfade(sub,0.12,2);}
      if(p>=1)setState('FALL');
    }
    else if(state==='FALL'){
      fallP=Math.min(1,stateT/2.1);
      if(sub&&AC)vglide(sub,WD.root/2*(1-0.35*fallP),0.2);
      if(fallP>=1){vacY=H*2.4;seedPollen(vacY,lowPerf?90:140);flowOn=true;
        shakeT=0.22;thud();setState('DESCENT');}
    }
    else if(state==='DESCENT'){
      camY+=(30+42*Math.min(1,stateT/4))*dt*(0.9+0.2*Math.sin(stateT*0.7));
      flowNear();
      if(camY>vacY-H*0.24){fossilize();startPortal(1);}
    }
    return;
  }
  if(world>=1&&world<=LAST){
    upForms();
    WORLD.def.tick();
    if(flowOn&&!flowMarked){flowMarked=true;shakeT=0.22;thud();} // мир вздрагивает — путь открыт
    if(flowOn){
      camY+=(34+40*Math.min(1,stateT/3))*dt;
      flowNear();
      if(camY>vacY-H*0.24){fossilize();startPortal(WORLD.def.portal);}
    }
    return;
  }
  if(world>LAST&&!showVit){ // разрез: реликвия → Витраж; жила → «Чистое стекло»
    const fw2=W*0.10,fh2=fw2*(H/W)*0.9,fx2=W/2-fw2/2,fy2=H*0.035;
    const inR=gaze.alive&&gaze.x>fx2-14&&gaze.x<fx2+fw2+14&&gaze.y>fy2-14&&gaze.y<fy2+fh2+14;
    vitT=inR?vitT+dt:Math.max(0,vitT-dt*2);
    if(vitT>=1.2){vitT=0;makeVitrail();}
    const inVein=gaze.alive&&Math.abs(gaze.x-W/2)<44&&gaze.y>H*0.45&&gaze.y<H*0.85;
    pglassT=inVein?pglassT+dt:Math.max(0,pglassT-dt*2);
    if(pglassT>=1.2){pglassT=0; // спуск заново, начисто: темп=1, счёт открыт
      pureMode=true;pureT=0;pureBlinks=0;pureSolids=0;pureDone=0;tempo=1;
      buildWorld(0);flashT=now/1000;gate();}
  }
}
function flowNear(){
  const near=Math.max(0,Math.min(1,(camY-(vacY-H*0.9))/(H*0.9)));
  if(AC&&fund)fund.g.gain.setTargetAtTime(0.07*(1-near*0.8),AC.currentTime,0.3);
}

/* ---------- рисование ---------- */
function glowP(x,y,r,l,a,h){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  const hue=(h===undefined)?WD.hue:h;
  g.addColorStop(0,lightH(hue,l,a));g.addColorStop(0.4,lightH(hue,l*0.8,a*0.35));g.addColorStop(1,lightH(hue,l*0.5,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
}
function drawForm(f,breath){
  f.sv+=(-f.so*60-f.sv*7)*dt;f.so+=f.sv*dt; // пружина формы
  const sx=f.x*W,sy=f.y-camY+f.so;
  if(sy<-90||sy>H+90)return;
  if(f.kind==='gate')return; // врата рисует мир
  if(f.kind==='dark')return; // тёмные семена изнанки рисует мир
  if(f.hidden&&!f.solid&&f.dwell<0.15)return; // Тяга: цель невидима — ищут пыльцой и слухом
  const R=Math.min(W,H)*f.r;
  if(f.kind==='anchor'){glowP(sx,sy,R*2.6,60,0.32+0.06*breath);glowP(sx,sy,R*0.9,75,0.5);return;}
  if(!f.solid){
    const d=f.dwell,pulse=0.5+0.5*Math.sin(now/1100+f.wob);
    const dist=gaze.alive?Math.hypot(gaze.x-sx,gaze.y-sy):1e9;
    const pre=Math.max(0,1-dist/(H*0.38));
    const preA=f.wither?0:0.22*pre; // цветок не «манит» взглядом — его так не взять
    glowP(sx,sy,R*(1.1+0.9*pre+1.4*d),42+22*pre+24*d,0.11+0.06*pulse+preA+0.42*d);
  }else{
    const w=(WORLD.def&&WORLD.def.weightOf)?WORLD.def.weightOf(f):0;
    let dim=(f.decaySolid&&!flowOn)?(0.35+0.65*f.dwell):1;
    if(f._old)dim*=0.72+0.10*Math.sin(now/300); // старейшая — на выдохе
    if(f.sunk)dim*=0.55; // уроненное стало прошлым
    glowP(sx,sy,R*(2.4+0.5*breath+0.8*w),68+8*breath,(0.5+0.15*breath)*dim);
    glowP(sx,sy,R*0.85,80,0.75*dim);
    if(w>0.05){
      const g=ctx.createRadialGradient(sx,sy+R*2*w,0,sx,sy+R*2*w,R*3*w+1);
      g.addColorStop(0,light(60,0.22*w));g.addColorStop(1,light(50,0));
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(sx,sy+R*1.6*w,R*1.6,R*2.2*w+0.1,0,0,6.283);ctx.fill();}
  }
}
function render(){
  const breath=0.5+0.5*Math.sin(now/1000/(4*tempo)*3.1416);
  ctx.globalCompositeOperation='source-over';
  const inv=WORLD.def&&WORLD.def.inverted;
  ctx.fillStyle=inv?`hsl(${WD.hue},45%,${6+1.4*breath}%)`:`hsl(${WD.hue},60%,${0.4+0.25*breath}%)`;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  let px=0,py=0,ps=1,alpha=1,rot=0,ty=0;
  if(portal&&portal.type===1){const e=Math.min(1,portal.t/1.6),s=e*e;px=W/2;py=H/2;ps=1-0.98*s;alpha=1-s*0.9;}
  if(portal&&(portal.type===3||portal.type===5))alpha=Math.max(0,1-portal.t/1.4);
  if(portal&&portal.type===6){const e=Math.min(1,portal.t/1.6);alpha=1-e*0.85;}
  if(portal&&portal.type===8){const e=Math.min(1,portal.t/1.9);px=W/2;py=H/2;rot=e*e*1.5;alpha=1-e*0.85;}
  if(portal&&portal.type===9){const e=Math.min(1,portal.t/2.1);alpha=1-e*0.7;}
  if(portal&&portal.type===10){const e=Math.min(1,portal.t/2.2);alpha=1-e*0.8;}
  if(portal&&portal.type===11){const e=Math.min(1,portal.t/2.2);ty=e*e*H*0.8;alpha=1-e*0.9;}
  if(portal&&portal.type===12){const e=Math.min(1,portal.t/2.4);alpha=1-e*0.75;}
  if(portal&&portal.type===13){const e=Math.min(1,portal.t/2.2);alpha=1-e*0.8;}
  if(portal&&(portal.type===14||portal.type===15)){const e=Math.min(1,portal.t/2.2);alpha=1-e*0.75;}
  if(portal&&portal.type===16){const e=Math.min(1,portal.t/2.2);alpha=1-e*0.85;}
  if(portal&&portal.type===17){const e=Math.min(1,portal.t/2.5);alpha=1-Math.max(0,e-0.5)*1.8;}
  if(portal&&portal.type===18){const e=Math.min(1,portal.t/2.2);alpha=1-e*0.75;}
  if(portal&&portal.type===19){const e=Math.min(1,portal.t/2.0);alpha=1-e*0.9;}
  if(portal&&portal.type===20){const e=Math.min(1,portal.t/2.7);alpha=1-e*0.8;}
  if(portal&&portal.type===21){const e=Math.min(1,portal.t/2.0),s=e*e;px=W*0.94;py=H*0.05;ps=1-0.985*s;alpha=1-s*0.85;}
  if(portal&&portal.type>=22&&portal.type<=50){const e=Math.min(1,portal.t/portalDur(portal.type));alpha=1-e*0.8;}
  ctx.save();
  if(ps!==1||rot!==0){ctx.translate(px,py);ctx.scale(ps,ps);ctx.rotate(rot);ctx.translate(-px,-py);}
  if(ty)ctx.translate(0,ty);
  if(shakeT>0)ctx.translate((Math.random()-0.5)*10*(shakeT/0.3),(Math.random()-0.5)*8*(shakeT/0.3));
  ctx.globalAlpha=alpha;

  if(world>0||state==='DESCENT'){
    for(let i=0;i<7;i++){
      const y=(i*H*0.42)-(camY*0.6%(H*0.42))+H*0.2,wob=Math.sin(now/1000*0.4+i)*8;
      const g=ctx.createLinearGradient(0,y-44+wob,0,y+44+wob);
      g.addColorStop(0,light(30,0));g.addColorStop(0.5,light(35,0.028+0.012*breath));g.addColorStop(1,light(30,0));
      ctx.fillStyle=g;ctx.fillRect(0,y-44+wob,W,88);}
  }
  if(inv){ // изнанка: взгляд гасит — след тёмный
    ctx.save();ctx.globalCompositeOperation='source-over';
    for(const p of trail){
      const k=1-p.age/p.life;if(k<=0)continue;
      const sy=p.y-camY,r=8+18*k;
      const g=ctx.createRadialGradient(p.x,sy,0,p.x,sy,r);
      g.addColorStop(0,`rgba(0,0,0,${0.5*k})`);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,sy,r,0,6.283);ctx.fill();}
    ctx.restore();
  } else for(const p of trail){
    const k=1-p.age/p.life;if(k<=0)continue;
    const sy=p.y-camY;
    glowP(p.x,sy,10+24*k,55+20*k,0.10*k);
    const ry=H-(sy-H*0.62);
    if(sy<H*0.62&&ry<H)glowP(p.x,ry,18*k,45,0.018*k);
  }
  for(const r of ripples){ // рябь прикосновения
    const k=1-r.t/0.9;
    ctx.strokeStyle=light(70,0.22*k);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(r.x,r.y-((world>0)?0:0),10+r.t*260,0,6.283);ctx.stroke();
  }
  if(world===0&&(state==='WORD'||state==='HEAVY'||state==='FALL')){
    ctx.font=`600 ${fontPx}px Georgia,'Times New Roman',serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const L of letters){
      L.sv=L.sv||0;L.so=L.so||0;
      L.sv+=(-L.so*60-L.sv*7)*dt;L.so+=L.sv*dt;
      let a,l,blur,dy=(L.drop||0)+L.so,sc=1;
      if(state==='FALL'){const e=fallP*fallP*(3-2*fallP);
        dy+=e*H*0.9;sc=1-0.55*e;a=0.9-0.5*e;l=70;blur=26;}
      else if(L.solid){a=0.85+0.15*breath;l=72;blur=24+10*breath;}
      else{const d=L.dwell,sh=0.5+0.5*Math.sin(now/900-L.x*0.012);
        a=0.16+0.10*sh+0.68*d;l=48+26*d;blur=8+20*d;}
      ctx.save();ctx.translate(L.x,L.y+dy);ctx.scale(sc,sc);
      ctx.shadowColor=light(l,0.9);ctx.shadowBlur=blur;
      ctx.fillStyle=light(l,a);ctx.fillText(L.ch,0,0);ctx.restore();}
  }
  if(world>=1&&world<=LAST){
    if(WORLD.def.draw)WORLD.def.draw(breath);
    for(const f of forms)drawForm(f,breath);
  }
  if(flowOn||world>0){
    for(let pi=0;pi<pollen.length;pi+=(lowPerf?2:1)){const p=pollen[pi];
      const sy=p.y-camY;
      if(sy<-30||sy>H+30)continue;
      const nearV=Math.max(0,1-Math.abs(p.y-vacY)/(H*1.2));
      glowP(p.x+Math.sin(p.ph)*6,sy,p.s+3*nearV,60,0.20+0.35*nearV);}
    const vy=vacY-camY;
    if(vy<H*1.5&&vacY>0){
      const g=ctx.createRadialGradient(W/2,vy,0,W/2,vy,Math.max(W,H)*0.55);
      g.addColorStop(0,light(40,0));g.addColorStop(0.13,light(40,0));
      g.addColorStop(0.3,light(55,0.10));g.addColorStop(1,light(40,0));
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  }
  for(const d of dust){const k=1-d.age/d.life;glowP(d.x,d.y-camY,3*k+1,70,0.3*k);}
  ctx.restore();ctx.globalAlpha=1;

  if(portal&&portal.type===2&&portal.parts){
    const e=Math.min(1,portal.t/1.7);
    for(const q of portal.parts){
      const s=Math.min(1,Math.max(0,e*1.2/q.d));
      glowP(q.x+(W/2-q.x)*s*s,q.y+(H/2-q.y)*s*s,3+4*(1-s),70,0.5*(1-e*0.5));}
    glowP(W/2,H/2,6+20*e,80,0.6*e);
  }
  if(portal&&portal.type===4){ // веки: створы тьмы смыкаются и открываются

      ctx.beginPath();ctx.moveTo(W*(0.2+0.15*b),H);
      const h=e*H*1.1;
      ctx.quadraticCurveTo(W*(0.2+0.15*b)+Math.sin(b*2)*40,H-h*0.5,
        W*(0.2+0.15*b)+Math.sin(b*3)*70,H-h);
      ctx.stroke();}
  }
  if(portal&&portal.type===45){ // великий отлив: вода уходит вниз
    const e=Math.min(1,portal.t/2.3);
    const wy=H*0.2+e*H*1.0;
    ctx.fillStyle=lightH(195,55,0.10*(1-e*0.5));
    ctx.fillRect(0,wy,W,H);
    ctx.strokeStyle=lightH(195,72,0.4*(1-e*0.4));ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=0;x<=W;x+=12)ctx.lineTo(x,wy+Math.sin(x*0.05+now/200)*5);
    ctx.stroke();
  }
  if(portal&&portal.type===46){ // чаши сходятся в равновесии
    const e=Math.min(1,portal.t/2.2);
    for(const s of[-1,1]){
      const x=W/2+s*(W*0.3*(1-e));
      ctx.strokeStyle=lightH(28,66,0.4*(1-e*0.4));ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,H/2,H*0.06,0.15*3.1416,0.85*3.1416);ctx.stroke();}
    if(e>0.9)glowP(W/2,H/2,40,82,0.7,28);
  }
  if(portal&&portal.type===47){ // аккорд-занавес: три линии сходятся в одну
    const e=Math.min(1,portal.t/2.2);
    for(let i=0;i<3;i++){
      const y=H*(0.3+0.2*i)*(1-e)+H*0.5*e;
      ctx.strokeStyle=lightH(315,68,0.4*(1-e*0.3));ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(W*0.1,y);ctx.lineTo(W*0.9,y);ctx.stroke();}
    if(e>0.85)glowP(W/2,H/2,36,84,0.6,315);
  }
  if(portal&&portal.type===48){ // туман рассеивается: фонарь съедает тьму
    const e=Math.min(1,portal.t/2.3);
    ctx.save();ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(0,0,0,0.86)';
    ctx.beginPath();ctx.rect(0,0,W,H);
    ctx.arc(W/2,H/2,e*Math.max(W,H)*0.8+20,0,6.283,true);ctx.fill();
    ctx.restore();
    glowP(W/2,H/2,10+16*e,78,0.4,210);
  }
  if(portal&&portal.type===49){ // нить распрямляется и лопается
    const e=Math.min(1,portal.t/2.2);
    const A=Math.max(0,40*(1-e*2));
    ctx.strokeStyle=lightH(70,70,0.45*(1-e*0.4));ctx.lineWidth=2.5;
    ctx.beginPath();
    if(e<0.5){
      for(let t=0;t<=1;t+=0.04)
        ctx.lineTo(W*0.1+W*0.8*t,H/2+Math.sin(t*12.56+now/120)*A);
    }else{
      const gap=(e-0.5)*2*W*0.3;
      ctx.moveTo(W*0.1,H/2);ctx.lineTo(W/2-gap,H/2);
      ctx.moveTo(W/2+gap,H/2);ctx.lineTo(W*0.9,H/2);}
    ctx.stroke();
    if(Math.abs(e-0.5)<0.06)glowP(W/2,H/2,30,86,0.7,70);
  }
  if(portal&&portal.type===50){ // три печати сливаются в трилистник — и в точку
    const e=Math.min(1,portal.t/2.6);
    const R=H*0.05*(1-e*0.7),d=H*0.09*(1-e);
    for(let i=0;i<3;i++){
      const a=-1.57+i*2.094;
      ctx.strokeStyle=lightH(258,72,0.5*(1-e*0.3));ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,Math.max(2,R),0,6.283);ctx.stroke();}
    if(e>0.85)glowP(W/2,H/2,26,88,(e-0.85)*4,258);
  }

  if(world>LAST){ // РАЗРЕЗ: пласты всех пройденных миров + жила пути
    const e=Math.min(1,stateT/2.5),NP=LAST+1;
    for(let wi=0;wi<NP;wi++){
      const baseY=H*(0.14+wi*(0.72/NP));
      const hue=wi===0?38:DEFS[wi-1].hue;
      const g=ctx.createLinearGradient(0,baseY-H*0.05,0,baseY+H*0.05);
      g.addColorStop(0,lightH(hue,35,0));g.addColorStop(0.5,lightH(hue,45,0.05*e));g.addColorStop(1,lightH(hue,35,0));
      ctx.fillStyle=g;ctx.fillRect(0,baseY-H*0.05,W,H*0.10);
      for(const m of fossils[wi])glowP(m.x,baseY+(m.y-H*0.45)*0.10,4,40,0.05*e,hue);
    }
    const vx=W*0.5+Math.sin(now/2600)*W*0.02;
    ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(vx,H*0.08);
    for(let y=H*0.08;y<=H*0.9;y+=H*0.02)ctx.lineTo(vx+Math.sin(y*0.01+now/900)*W*0.015,y);
    const g=ctx.createLinearGradient(0,H*0.08,0,H*0.9);
    g.addColorStop(0,lightH(38,70,0.10*e));g.addColorStop(1,lightH(16,70,0.10*e));
    ctx.strokeStyle=g;ctx.stroke();
    // реликвия: окно, выжженное в вечность — первое, что не тает
    const fw2=W*0.10,fh2=fw2*(H/W)*0.9,fx2=W/2-fw2/2,fy2=H*0.035;
    ctx.strokeStyle=lightH(252,72,e*(0.12+0.06*Math.sin(now/1300))+0.4*Math.min(1,vitT));
    ctx.lineWidth=1.5+1.5*Math.min(1,vitT);ctx.strokeRect(fx2,fy2,fw2,fh2);
    if(showVit&&vitC){ // Витраж поверх разреза
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
      const sc=Math.min(W*0.86/vitC.width,H*0.86/vitC.height);
      const dw=vitC.width*sc,dh=vitC.height*sc;
      ctx.drawImage(vitC,(W-dw)/2,(H-dh)/2,dw,dh);
      ctx.globalCompositeOperation='lighter';
    }
  }

  const tn=now/1000;
  if(tn-flashT<0.10){ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=`rgba(0,0,0,${1-(tn-flashT)/0.10})`;ctx.fillRect(0,0,W,H);}

  ctx.globalCompositeOperation='lighter';
  if(gaze.alive&&!(portal&&portal.type===1&&portal.t>1.2)){
    const still=performance.now()-lastMoveT>1200;
    if(inv){
      ctx.save();ctx.globalCompositeOperation='source-over';
      const r=10+3*breath;
      const g=ctx.createRadialGradient(gaze.x,gaze.y,0,gaze.x,gaze.y,r*2.4);
      g.addColorStop(0,'rgba(0,0,0,0.85)');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(gaze.x,gaze.y,r*2.4,0,6.283);ctx.fill();ctx.restore();
      ctx.strokeStyle=light(60,still?0.3:0.5);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(gaze.x,gaze.y,r,0,6.283);ctx.stroke();
    }else{
      glowP(gaze.x,gaze.y,(7+3*breath)*3,78,still?0.5:0.85);
      ctx.fillStyle=light(85,0.95);
      ctx.beginPath();ctx.arc(gaze.x,gaze.y,2.2+0.8*breath,0,6.283);ctx.fill();
    }}
  if(!gaze.alive)glowP(W/2,H*0.55,26+8*breath,70,0.5);

  ctx.globalCompositeOperation='lighter';
  ctx.font='12px Georgia,serif';ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillStyle=light(65,0.35);
  ctx.fillText(String(Math.min(world,LAST+1)),W-10,10); // номер уровня — для тестов

  if(veil){ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    glowP(W/2,H/2,20+10*breath,60,0.35);}

  if(pureMode){ // «Чистое стекло»: единственные цифры игры
    const fmt=t=>{const m=(t/60)|0,s=t-m*60;
      return (m<10?'0':'')+m+':'+(s<10?'0':'')+s.toFixed(1);};
    ctx.globalCompositeOperation='lighter';
    ctx.font='14px Georgia,serif';ctx.textAlign='left';ctx.textBaseline='top';
    if(world<=LAST){
      ctx.fillStyle=light(70,0.45);
      ctx.fillText(fmt(pureT),12,10);
    }else if(pureDone>0){ // итог: время · веки · свет
      ctx.textAlign='center';ctx.font='20px Georgia,serif';
      ctx.fillStyle=lightH(252,75,0.7);
      ctx.fillText(fmt(pureDone),W/2,H*0.885);
      ctx.font='13px Georgia,serif';ctx.fillStyle=lightH(252,70,0.5);
      ctx.fillText('\u25CC '+pureBlinks+'   \u2022 '+pureSolids,W/2,H*0.885+26);
    }
    if(world>LAST&&pglassT>0){ // жила разгорается под удержанием
      const vx=W*0.5;
      glowP(vx,H*0.65,30+40*Math.min(1,pglassT),70,0.25*Math.min(1,pglassT),252);
    }
  } else if(world>LAST&&pglassT>0){
    glowP(W*0.5,H*0.65,30+40*Math.min(1,pglassT),70,0.25*Math.min(1,pglassT),252);
  }
}

/* ---------- цикл ---------- */
function loop(tn){
  dt=Math.min(0.05,(tn-now)/1000);now=tn;
  perfEMA=perfEMA*0.95+dt*0.05;lowPerf=perfEMA>0.024;trailMax=lowPerf?450:800;
  update();render();
  requestAnimationFrame(loop);
}
fit();buildWorld(0);requestAnimationFrame(loop);
</script>
</body>
